name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dom-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save jsdom
      - run: node test-dom.js
      - name: EN build is up to date
        run: node tools/build_en.js && git diff --exit-code en/index.html
      - run: node tools/test-en.js
