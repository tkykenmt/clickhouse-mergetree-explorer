<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeTree Explorer V2 | ClickHouse ストレージが動いて見える</title>
<style>
:root{
  --bg:#0c0d10; --panel:#14161bee; --line:#262a33; --ink:#e8eaf0; --muted:#98a0b3;
  --yellow:#faff69; --cyan:#6fe3ff; --green:#7dffb2; --red:#ff7d7d; --dim:#707a8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp)}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:14px;align-items:center;padding:12px 18px;background:linear-gradient(#0c0d10f0,#0c0d1000);z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud h1{font-size:18px;margin:0;white-space:nowrap}
#hud h1 b{color:var(--yellow)}
#hud .cap{font-size:12px;color:var(--muted)}
.btn{background:#191c23;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--jp);white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1c1c05}
#hud{flex-wrap:wrap}
#sqlbar{flex-basis:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--cyan);white-space:nowrap;overflow-x:auto}
#sqlbar .cm{color:var(--dim)}
#steps{flex-basis:100%;display:none;gap:8px;align-items:center;font-size:12px;color:var(--dim);font-family:var(--jp)}
#steps.show{display:flex}
#steps i{font-style:normal;color:#3a4152}
#steps .step{border:1px solid var(--line);border-radius:99px;padding:3px 12px;white-space:nowrap}
#steps .step.on{border-color:var(--yellow);color:var(--yellow)}
#steps .step.done{border-color:#2f5c41;color:var(--green)}
#steps .step.done::after{content:" ✓"}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink);z-index:10;opacity:0;transition:opacity .25s;max-width:94vw}
#toast.on{opacity:1}
#toast.warn{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div id="hud">
  <h1>MergeTree <b>Explorer</b> <span style="font-size:11px;border:1px solid var(--yellow);color:var(--yellow);border-radius:99px;padding:2px 8px;vertical-align:middle">V2 PREVIEW</span></h1>
  <span class="cap">Part は値グリッド、granule は行、索引はカード。<b style="color:var(--ink)">公式ブログの図の語彙のまま、それが動く</b></span>
  <span style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button class="btn primary" id="bIns">＋ INSERT</button>
    <button class="btn" id="bMerge">⇄ マージ</button>
    <span style="display:flex;gap:8px;align-items:center;background:#191c23;border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-size:12.5px">
      <span style="font-family:var(--mono);color:var(--muted)">WHERE user_id ≧</span>
      <input type="range" id="predR" min="0" max="1000" step="10" value="600" style="width:110px;accent-color:#6fe3ff">
      <b id="predV" style="font-family:var(--mono);color:var(--cyan);min-width:34px">600</b>
    </span>
    <button class="btn" id="bSel">▶ SELECT</button>
    <button class="btn" id="bAmb">▶ 自動再生</button>
  </span>
  <div id="sqlbar"></div>
  <div id="steps">
    <span class="step" data-s="1">① 索引分析(二分探索)</span><i>→</i>
    <span class="step" data-s="2">② 対象 granule だけ読む</span><i>→</i>
    <span class="step" data-s="3">③ レーン並列処理(SIMD)</span><i>→</i>
    <span class="step" data-s="4">④ 部分集計をマージ</span>
  </div>
</div>
<canvas id="cv"></canvas>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   V2 スパイク(ブログ調): index-based pruning の図をそのまま動かす。
   メタファー無し — Part は値グリッド、granule は 4 値の行、
   primary.idx は g→先頭値 のカード。INSERT の飛来ソート、
   マージの併合、SELECT の索引スキャン→枝刈りをアニメで見せる。
============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize); resize();

const MONO=()=>getComputedStyle(document.body).getPropertyValue('--mono');
const JP=()=>getComputedStyle(document.body).getPropertyValue('--jp');

/* ---- 寸法 ---- */
const CELL=34, CELLH=24, GAP=3;     // 値セル
const GPR=4;                        // granule あたりの値の数(8192 行の縮尺)
const IDXW=104;                     // 索引カード幅

/* ---- 状態 ---- */
let seq=0, parts=[], fly=[], lanes=[], ambTimer=null, ambN=0, busy=false;
const LANES=3; // max_threads の縮尺
function laneGeom(i){
  const w=Math.min(380,(W-60)/LANES-12);
  return {x:(W-(w+14)*LANES)/2+i*(w+14)+7, y:H-186, w, h:132};
}
function granRowPos(p,gi){ return {x:p.x+24, y:p.y+30+gi*(CELLH+GAP)}; }
function mkGranules(vals){ const gs=[]; for(let i=0;i<vals.length;i+=GPR) gs.push(vals.slice(i,i+GPR)); return gs; }
function partW(p){ return GPR*(CELL+GAP)+24+IDXW+12+58; }
function partH(p){ return Math.max(p.granules.length*(CELLH+GAP), p.granules.length*16+36)+42; }
function layout(){
  const y0=182, x0=24, maxW=W-24;
  let x=x0, y=y0, rowH=0;
  parts.forEach(p=>{
    const w=partW(p), h=partH(p);
    if(x+w>maxW){ x=x0; y+=rowH+18; rowH=0; }
    p.tx=x; p.ty=y;
    if(p.x==null){ p.x=x; p.y=-180; }
    x+=w+18; rowH=Math.max(rowH,h);
  });
}

/* ---- アニメーション駆動 ---- */
function tick(){
  parts.forEach(p=>{
    p.x+=(p.tx-p.x)*0.12; p.y+=(p.ty-p.y)*0.12;
    if(p.flash>0) p.flash=Math.max(0,p.flash-0.02);
    if(p.dying){ p.alpha=Math.max(0,(p.alpha??1)-0.05); if(p.alpha===0) p.dead=true; }
  });
  const before=parts.length;
  parts=parts.filter(p=>!p.dead);
  if(parts.length!==before) layout();
  lanes.forEach(l=>{ if(l.simd>0) l.simd=Math.max(0,l.simd-0.09); if(l.lastAdd) { l.lastAdd.t-=0.02; if(l.lastAdd.t<=0) l.lastAdd=null; } });
  fly=fly.filter(f=>{
    f.t+=f.dt||0.02;
    const e=1-Math.pow(1-Math.min(1,f.t),3);
    f.x=f.fx+(f.txp-f.fx)*e; f.y=f.fy+(f.typ-f.fy)*e;
    if(f.t>=1){ if(f.done){ const fn=f.done; f.done=null; fn(); } return false; }
    return true;
  });
}

/* ---- 操作: INSERT(飛来 → ソート → Part 化) ---- */
function doInsert(){
  if(busy){ toast('実行中です','warn'); return; }
  busy=true;
  const n=8+Math.floor(Math.random()*5);
  const vals=Array.from({length:n},()=>Math.floor(Math.random()*1000));
  const sorted=[...vals].sort((a,b)=>a-b);
  const gN=Math.ceil(n/GPR);
  showSql('INSERT INTO events (user_id, …) VALUES '+vals.slice(0,4).map(v=>'('+v+', …)').join(' ')+' …  -- '+(gN*8192).toLocaleString()+' 行(セルは代表値)');
  const cx=W/2-(n*(CELL+GAP))/2, cy=118;
  vals.forEach((v,i)=>{
    fly.push({v, fx:W/2+(Math.random()*500-250), fy:-50-Math.random()*90,
      txp:cx+i*(CELL+GAP), typ:cy, t:0, dt:0.024, kind:'raw'});
  });
  setTimeout(()=>{
    toast('ORDER BY 順にソートし、8,192 行ごとに granule に区切る。図のセルは各 granule の代表値で、1行 = 8,192 行の窓');
    fly.forEach(f=>{ if(f.kind==='raw'){ f.fx=f.x; f.fy=f.y; f.txp=cx+sorted.indexOf(f.v)*(CELL+GAP); f.typ=cy; f.t=0; f.kind='sorting'; } });
    setTimeout(()=>{
      seq++;
      const p={id:seq,name:'202607_'+seq+'_'+seq+'_0',granules:mkGranules(sorted),lvl:0,flash:1,x:null,y:null};
      parts.push(p); layout();
      p.x=W/2-partW(p)/2; p.y=cy-6;
      fly=fly.filter(f=>f.kind!=='sorting');
      showSql('-- 新しい Part '+p.name+'(granule ×'+p.granules.length+' + primary.idx)');
      busy=false;
    },1200);
  },1400);
}

/* ---- 操作: マージ ---- */
function doMerge(){
  if(busy){ toast('実行中です','warn'); return; }
  const act=parts.filter(p=>!p.dying);
  if(act.length<2){ toast('マージ対象なし(Part が2つ以上必要)','warn'); return; }
  busy=true;
  const vals=act.flatMap(p=>p.granules.flat()).sort((x,y)=>x-y);
  showSql('OPTIMIZE TABLE events  -- '+act.length+' 個の Part をマージソートで1つに併合');
  act.forEach(p=>{ p.dying=true; });
  const gBefore=act.reduce((s,p)=>s+p.granules.length,0);
  const ids=act.map(p=>p.id), lvl=Math.max(...act.map(p=>p.lvl))+1;
  setTimeout(()=>{
    seq++;
    const p={id:seq,name:'202607_'+Math.min(...ids)+'_'+Math.max(...ids)+'_'+lvl,
      granules:mkGranules(vals),lvl,flash:1,x:null,y:null,merged:true};
    parts.unshift(p); layout();
    const gAfter=p.granules.length;
    toast(act.length+' 個の Part の行を並べ直して1つに置き換え。元の Part は書き換えず引退'+(gAfter<gBefore?'。granule '+gBefore+' → '+gAfter+'(末尾の端数が詰め直された)':''));
    busy=false;
  },700);
}

/* ---- 操作: SELECT(索引スキャン → 枝刈り) ---- */
let PRED=600;
function hiOf(p,i){ return (i+1<p.granules.length)?p.granules[i+1][0]:1000; }
function doSelect(){
  if(busy){ toast('実行中です','warn'); return; }
  const act=parts.filter(p=>!p.dying);
  if(!act.length){ toast('Part がありません。まず INSERT を','warn'); return; }
  busy=true;
  setStage(1);
  showSql('SELECT count() FROM events WHERE user_id >= '+PRED+'  -- ① 各 Part の primary.idx を二分探索');
  toast('① 索引分析: 各 Part の primary.idx 上で「user_id ≧ '+PRED+' を含みうる最初の granule」を二分探索。触るのは索引エントリだけで、値の行はまだ読まない');
  const st=act.map(p=>{
    const n=p.granules.length;
    const s={p,lo:0,hi:n-1,done:false};
    if(n<=1){ s.k=(hiOf(p,0)>=PRED)?0:n; s.done=true; }
    return s;
  });
  const iv=setInterval(()=>{
    let any=false;
    st.forEach(s=>{
      if(s.done){ s.p.probe=undefined; return; }
      any=true;
      const mid=(s.lo+s.hi)>>1;
      s.p.probe=mid;
      if(hiOf(s.p,mid)>=PRED) s.hi=mid; else s.lo=mid+1;
      if(s.lo>=s.hi){
        s.k=(hiOf(s.p,s.lo)>=PRED)?s.lo:s.p.granules.length;
        s.done=true;
      }
    });
    if(!any){
      clearInterval(iv);
      const kept=[];
      st.forEach(s=>{
        const p=s.p, n=p.granules.length, k=s.k;
        p.probe=undefined;
        p.verdict=Array.from({length:n},(_,i)=>i>=k);
        p.rangeK=k; p.showVerdict=1;
        p.granules.forEach((g,gi)=>{ if(gi>=k) kept.push({g,p,gi}); });
      });
      const total=act.reduce((s2,p)=>s2+p.granules.length,0);
      startRead(act,kept,total);
    }
  },700);
}
function startRead(act,kept,total){
  // ② 対象 granule だけをストレージから読む(✂ は読まれない)
  setStage(2);
  const ranges=act.filter(p=>p.rangeK<p.granules.length)
    .map(p=>'g'+(p.rangeK+1)+(p.rangeK+1<p.granules.length?'〜g'+p.granules.length:''));
  showSql('SELECT count() FROM events WHERE user_id >= '+PRED+'  -- ② 読むのは '+kept.length+' / '+total+' granule('+(ranges.join(', ')||'なし')+')');
  toast('② 読み取り: 生き残った granule は<b>連続した range</b>('+(ranges.join(' / ')||'なし')+')としてまとめて読む。✂ の '+(total-kept.length)+' granule には一切触れない');
  if(!kept.length){
    setTimeout(()=>{
      showSql('SELECT count() FROM events WHERE user_id >= '+PRED+'  -- count() = 0(索引だけで証明、読み取りゼロ)');
      toast('該当しうる granule がゼロ。ストレージに一切触れず count() = 0 を確定');
      setTimeout(()=>{ act.forEach(p=>{ p.showVerdict=0; p.verdict=null; }); setStage(0); busy=false; },4200);
    },600);
    return;
  }
  lanes=Array.from({length:LANES},(_,i)=>({i,queue:[],cur:null,simd:0,partial:0,fed:0}));
  let arrived=0;
  kept.forEach((k,idx)=>{
    const lane=lanes.reduce((a,b)=>a.fed<=b.fed?a:b); // 動的配分(空いているレーンへ)
    lane.fed++;
    const src=granRowPos(k.p,k.gi);
    const lg=laneGeom(lane.i);
    setTimeout(()=>{
      fly.push({cells:k.g, fx:src.x, fy:src.y, txp:lg.x+12, typ:lg.y+34, t:0, dt:0.022, kind:'gran',
        done:()=>{ lane.queue.push({cells:k.g}); arrived++; if(arrived===kept.length) startProcess(act,kept.length,total); }});
    }, idx*90);
  });
}
function startProcess(act,keptN,total){
  // ③ ベクトル化実行: レーンごとに granule を SIMD で一括評価し、部分集計を積む
  setStage(3);
  showSql('SELECT count() FROM events WHERE user_id >= '+PRED+'  -- ③ '+LANES+' レーンが並列にベクトル化実行(SIMD)');
  toast('③ 並列処理: granule は '+LANES+' 本のレーン(= max_threads)へ動的に配分。各レーンは行の束を SIMD で一括評価し、自分の部分集計を持つ');
  const proc=setInterval(()=>{
    let active=false;
    lanes.forEach(l=>{
      if(l.simd>0){ active=true; return; }           // 評価アニメ中
      if(l.cur){ // 評価完了 → 部分集計へ
        const m=l.cur.cells.filter(v=>v>=PRED).length;
        const add=Math.round(m/GPR*8192);
        l.partial+=add;
        l.lastAdd={v:add,t:1};
        l.cur=null;
      }
      if(l.queue.length){ l.cur=l.queue.shift(); l.simd=1; active=true; }
    });
    if(!active&&fly.every(f=>f.kind!=='gran')){
      clearInterval(proc);
      const cnt=lanes.reduce((s,l)=>s+l.partial,0);
      setStage(4);
      showSql('SELECT count() FROM events WHERE user_id >= '+PRED+'  -- ④ 部分集計をマージ → count() = '+cnt.toLocaleString());
      toast('④ 各レーンの部分集計をマージして完成: count() = '+cnt.toLocaleString()+'。全 '+total+' granule('+(total*8192).toLocaleString()+' 行)のうち読んだのは '+keptN+' granule だけ');
      setTimeout(()=>{ lanes=[]; act.forEach(p=>{ p.showVerdict=0; p.verdict=null; p.rangeK=null; }); setStage(0); busy=false; },6000);
    }
  },380);
}
/* ---- 描画 ---- */
function cellColor(v){ return 'hsl('+(205+v/1000*35)+' 16% 20%)'; }
function drawPart(p){
  const w=partW(p), h=partH(p);
  ctx.globalAlpha=p.alpha??1;
  ctx.fillStyle='#14161b';
  ctx.strokeStyle=p.merged?'#faff69':'#262a33';
  ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); ctx.stroke();
  if(p.flash>0){ ctx.fillStyle='rgba(125,255,178,'+(p.flash*0.25)+')'; ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); }
  ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
  ctx.fillText('Part '+p.name+' ('+(p.granules.length*8192).toLocaleString()+' 行)'+(p.lvl>0?'  マージ産':''), p.x+10, p.y+17);
  const gx=p.x+24, gy=p.y+30;
  p.granules.forEach((g,gi)=>{
    const ry=gy+gi*(CELLH+GAP);
    const scanned=p.scanG===gi;
    ctx.fillStyle=scanned?'#faff69':'#707a8c'; ctx.font='10px '+MONO();
    ctx.fillText('g'+(gi+1), p.x+6, ry+15);
    g.forEach((v,ci)=>{
      const cxp=gx+ci*(CELL+GAP);
      let fill=cellColor(v), tcol='#e8eaf0', dead=false;
      if(p.showVerdict&&p.verdict){
        if(!p.verdict[gi]){ fill='#141519'; tcol='#494f5e'; dead=true; }
        else if(v>=PRED){ fill='#153a2a'; tcol='#7dffb2'; }
        else { fill='#1b2431'; tcol='#8b93a5'; }
      }
      ctx.fillStyle=fill;
      ctx.beginPath(); ctx.roundRect(cxp,ry,CELL,CELLH,4); ctx.fill();
      if(scanned){ ctx.strokeStyle='#faff69'; ctx.strokeRect(cxp+0.5,ry+0.5,CELL-1,CELLH-1); }
      ctx.fillStyle=tcol; ctx.font='11px '+MONO(); ctx.textAlign='center';
      ctx.fillText(String(v), cxp+CELL/2, ry+16); ctx.textAlign='left';
    });
    // 縮尺の明示: セルは代表値で、1行 = 8,192 行。刈られた行は ✂
    const pruned=p.showVerdict&&p.verdict&&!p.verdict[gi];
    ctx.fillStyle=pruned?'#ff7d7d':'#4d5563'; ctx.font='9px '+MONO();
    ctx.fillText(pruned?'✂ 8,192行':'…8,192行', gx+GPR*(CELL+GAP)+2, ry+15);
  });
  const ix=gx+GPR*(CELL+GAP)+56, iy=p.y+30;
  const ih=p.granules.length*16+34;
  ctx.fillStyle='#1a1c10'; ctx.strokeStyle='#8a8f3a';
  ctx.beginPath(); ctx.roundRect(ix,iy,IDXW,ih,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#faff69'; ctx.font='700 10px '+MONO();
  ctx.fillText('primary.idx', ix+8, iy+14);
  p.granules.forEach((g,gi)=>{
    const probing=p.probe===gi;
    const inRange=p.showVerdict&&p.verdict&&p.verdict[gi];
    if(probing){ ctx.fillStyle='rgba(250,255,105,.18)'; ctx.fillRect(ix+3,iy+18+gi*16,IDXW-6,14); }
    if(inRange){ ctx.fillStyle='#7dffb2'; ctx.fillRect(ix+3,iy+18+gi*16,2,14); }
    ctx.fillStyle=probing?'#faff69':(inRange?'#d5f6c9':'#b9bd7a');
    ctx.font=(probing?'700 ':'')+'10px '+MONO();
    ctx.fillText('g'+(gi+1)+' → '+g[0]+(probing?' ?':''), ix+8, iy+28+gi*16);
  });
  if(p.showVerdict&&p.rangeK!=null&&p.rangeK<p.granules.length){
    ctx.fillStyle='#6fe3ff'; ctx.font='700 9px '+MONO();
    ctx.fillText('range: g'+(p.rangeK+1)+'〜g'+p.granules.length, ix+8, iy+ih-6);
  }
  ctx.globalAlpha=1;
}
function drawLanes(){
  if(!lanes.length) return;
  lanes.forEach(l=>{
    const g=laneGeom(l.i);
    ctx.fillStyle='#111319'; ctx.strokeStyle='#262a33';
    ctx.beginPath(); ctx.roundRect(g.x,g.y,g.w,g.h,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
    ctx.fillText('processing lane '+(l.i+1), g.x+10, g.y+17);
    // 3工程のゾーン: 受取待ち | SIMD 一括評価 | 部分集計
    const zoneY=g.y+26, zoneH=g.h-56;
    const z1w=g.w*0.24, z2w=g.w*0.44, z3w=g.w*0.26;
    const z1x=g.x+8, z2x=z1x+z1w+10, z3x=z2x+z2w+10;
    // ゾーン枠
    [[z1x,z1w,'#262a33'],[z2x,z2w,l.simd>0?'#3d8ba3':'#262a33'],[z3x,z3w,'#2f5c41']].forEach(([zx,zw,col])=>{
      ctx.strokeStyle=col; ctx.setLineDash([3,3]);
      ctx.strokeRect(zx,zoneY,zw,zoneH); ctx.setLineDash([]);
    });
    // ① 受取待ち(キューの mini 行)
    l.queue.slice(0,3).forEach((q,qi)=>{
      const my=zoneY+6+qi*12;
      q.cells.forEach((v,ci)=>{
        ctx.fillStyle='#1b2c3a';
        ctx.fillRect(z1x+5+ci*((z1w-14)/GPR), my, (z1w-14)/GPR-2, 9);
      });
    });
    if(l.queue.length>3){ ctx.fillStyle='#5a6478'; ctx.font='9px '+MONO(); ctx.fillText('+'+(l.queue.length-3), z1x+5, zoneY+zoneH-5); }
    // ② SIMD 一括評価(現在の granule)
    if(l.cur){
      const cw=(z2w-16)/GPR;
      l.cur.cells.forEach((v,ci)=>{
        const cxp=z2x+8+ci*cw;
        const hit=v>=PRED;
        ctx.fillStyle=l.simd>0?(hit?'rgba(125,255,178,'+(0.35+l.simd*0.6)+')':'rgba(111,227,255,'+(0.2+l.simd*0.5)+')'):(hit?'#153a2a':'#1b2431');
        ctx.beginPath(); ctx.roundRect(cxp,zoneY+10,cw-3,CELLH,4); ctx.fill();
        ctx.fillStyle=hit?'#7dffb2':'#c7cede'; ctx.font='10px '+MONO(); ctx.textAlign='center';
        ctx.fillText(String(v),cxp+(cw-3)/2,zoneY+26); ctx.textAlign='left';
      });
    }
    // ③ 部分集計(レーンローカル)
    ctx.fillStyle='#7dffb2'; ctx.font='700 13px '+MONO(); ctx.textAlign='center';
    ctx.fillText(l.partial.toLocaleString(), z3x+z3w/2, zoneY+24);
    if(l.lastAdd){ ctx.globalAlpha=Math.max(0,l.lastAdd.t); ctx.fillStyle='#7dffb2'; ctx.font='11px '+MONO();
      ctx.fillText('+'+l.lastAdd.v.toLocaleString(), z3x+z3w/2, zoneY+24-14*(1-l.lastAdd.t)-12); ctx.globalAlpha=1; }
    ctx.textAlign='left';
    // ゾーンのキャプションと矢印
    ctx.fillStyle='#5a6478'; ctx.font='9px '+JP();
    ctx.fillText('受取待ち', z1x+2, g.y+g.h-8);
    ctx.fillStyle=l.simd>0?'#6fe3ff':'#5a6478';
    ctx.fillText('SIMD 一括評価(束ごと)', z2x+2, g.y+g.h-8);
    ctx.fillStyle='#5a6478';
    ctx.fillText('部分集計', z3x+2, g.y+g.h-8);
    ctx.fillStyle='#3a4152'; ctx.font='11px '+MONO();
    ctx.fillText('→', z2x-9, zoneY+zoneH/2+4);
    ctx.fillText('→', z3x-9, zoneY+zoneH/2+4);
  });
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1d2331'; ctx.setLineDash([5,5]);
  ctx.strokeRect(20,106,W-40,48); ctx.setLineDash([]);
  ctx.fillStyle='#5a6478'; ctx.font='10px '+JP(); ctx.textAlign='left';
  ctx.fillText('INSERT ブロック(届いた順) → ソート → granule 区切り', 26, 120);
  parts.forEach(drawPart);
  drawLanes();
  fly.forEach(f=>{
    if(f.kind==='gran'){
      f.cells.forEach((v,ci)=>{
        ctx.fillStyle='#1b2c3a'; ctx.strokeStyle='#3d8ba3';
        ctx.beginPath(); ctx.roundRect(f.x+ci*(CELL*0.7),f.y,CELL*0.65,CELLH*0.8,3); ctx.fill(); ctx.stroke();
      });
      return;
    }
    ctx.fillStyle=f.kind==='sorting'?'#153a2a':'#1b2431';
    ctx.strokeStyle=f.kind==='sorting'?'#7dffb2':'#3a4152';
    ctx.beginPath(); ctx.roundRect(f.x,f.y,CELL,CELLH,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e8eaf0'; ctx.font='11px '+MONO(); ctx.textAlign='center';
    ctx.fillText(String(f.v), f.x+CELL/2, f.y+16); ctx.textAlign='left';
  });
}
function loop(){ tick(); render(); requestAnimationFrame(loop); }

/* ---- HUD ---- */
const sqlEl=document.getElementById('sqlbar'), toastEl=document.getElementById('toast');
let toastT=null;
function showSql(s){ sqlEl.textContent=s; }
function setStage(n){ // 0 = 非表示
  const box=document.getElementById('steps');
  if(n===0){ box.classList.remove('show'); return; }
  box.classList.add('show');
  box.querySelectorAll('.step').forEach(el=>{
    const s=+el.dataset.s;
    el.classList.toggle('on',s===n);
    el.classList.toggle('done',s<n);
  });
}
function toast(s,warn){ toastEl.textContent=s; toastEl.className=warn?'on warn':'on'; toastEl.id='toast'; clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),6200); }
document.getElementById('bIns').addEventListener('click',doInsert);
document.getElementById('bMerge').addEventListener('click',doMerge);
document.getElementById('bSel').addEventListener('click',doSelect);
document.getElementById('predR').addEventListener('input',()=>{ PRED=+document.getElementById('predR').value; document.getElementById('predV').textContent=PRED; });
document.getElementById('bAmb').addEventListener('click',()=>{
  const b=document.getElementById('bAmb');
  if(ambTimer){ clearInterval(ambTimer); ambTimer=null; b.textContent='▶ 自動再生'; return; }
  b.textContent='⏹ 自動再生中';
  ambTimer=setInterval(()=>{
    if(busy) return;
    ambN++;
    const act=parts.filter(p=>!p.dying);
    const totalG=act.reduce((s,p)=>s+p.granules.length,0);
    if(ambN%4===0){ doSelect(); return; }
    if(totalG>=14||act.length>=5){ doMerge(); return; }
    doInsert();
  },5200);
});

/* ---- 初期状態(ブログの例と同じ気分の値) ---- */
(function init(){
  const mk=(vals,lvl,name)=>{ seq++; const p={id:seq,name,granules:mkGranules(vals.sort((a,b)=>a-b)),lvl,flash:0,x:null,y:null,merged:lvl>0}; parts.push(p); };
  mk([40,100,400,40,700,400,40,500,900,50,300,600],2,'202607_1_5_2');
  mk([60,300,600,60,500,900,60,900,620],0,'202607_6_6_0');
  layout(); parts.forEach(p=>{ p.x=p.tx; p.y=p.ty; });
  showSql('CREATE TABLE events (user_id UInt32, …) ENGINE = MergeTree ORDER BY user_id;');
  window.__v2={ get parts(){return parts;} };
  loop();
})();
</script>
