<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeTree Explorer V2 | ClickHouse ストレージが動いて見える</title>
<style>
:root{
  --bg:#0c0d10; --panel:#14161bee; --line:#262a33; --ink:#e8eaf0; --muted:#98a0b3;
  --yellow:#faff69; --cyan:#6fe3ff; --green:#7dffb2; --red:#ff7d7d; --dim:#707a8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp)}
canvas{display:block;touch-action:none}
#crumb{flex-basis:100%;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim);font-family:var(--jp);margin-top:-4px}
#crumb span{cursor:pointer;border-bottom:1px dotted #3a4152;padding:1px 2px}
#crumb span.on{color:var(--yellow);border-color:var(--yellow);font-weight:700}
#crumb i{font-style:normal;color:#3a4152}
#lvlhint{position:fixed;right:12px;bottom:12px;font-size:10px;color:#57617a;z-index:9;pointer-events:none;font-family:var(--jp)}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:14px;align-items:center;padding:12px 18px;background:linear-gradient(#0c0d10f0,#0c0d1000);z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud h1{font-size:18px;margin:0;white-space:nowrap}
#hud h1 b{color:var(--yellow)}
#hud .cap{font-size:12px;color:var(--muted)}
.btn{background:#191c23;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--jp);white-space:nowrap;touch-action:manipulation}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1c1c05}
#hud{flex-wrap:wrap}
#sqlbar{flex-basis:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--cyan);white-space:nowrap;overflow-x:auto}
#sqlbar .cm{color:var(--dim)}
#resgrid{flex-basis:100%;background:#101a13;border:1px solid #2f5c41;border-radius:10px;padding:6px 14px;font-family:var(--mono);font-size:12px;color:#d5f6c9;max-height:104px;overflow:auto;margin-top:-4px}
#resgrid table{border-collapse:collapse}
#resgrid th{color:#5f8a6f;text-align:left;font-size:10px;border-bottom:1px solid #24402f;padding:1px 26px 2px 0;font-weight:700}
#resgrid td{padding:1px 26px 1px 0;white-space:nowrap}
#resgrid .msg{color:#5f8a6f;font-size:11px;padding:2px 0}
#steps{flex-basis:100%;display:none;gap:8px;align-items:center;font-size:12px;color:var(--dim);font-family:var(--jp)}
#steps.show{display:flex}
#steps i{font-style:normal;color:#3a4152}
#steps .step{border:1px solid var(--line);border-radius:99px;padding:3px 12px;white-space:nowrap}
#steps .step.on{border-color:var(--yellow);color:var(--yellow)}
#steps .step.done{border-color:#2f5c41;color:var(--green)}
#steps .step.done::after{content:" ✓"}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink);z-index:10;opacity:0;transition:opacity .25s;max-width:94vw}
#toast.on{opacity:1}
#toast.warn{border-color:var(--red);color:var(--red)}
@media (max-width:700px){
  #hud{gap:8px;padding:8px 10px}
  #hud h1{font-size:15px}
  #hud .cap{display:none}
  #ctrl{margin-left:0 !important;flex-basis:100%;flex-wrap:wrap;gap:6px !important}
  .btn{padding:7px 10px;font-size:12px}
  #ctrl>span{padding:4px 8px !important;font-size:11.5px !important}
  #predR{width:70px !important}
  #sqlbar{font-size:11px;padding:6px 10px}
  #resgrid{max-height:64px;font-size:10.5px;padding:4px 10px}
  #steps{font-size:10.5px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #steps .step{padding:2px 8px}
  #toast{font-size:12px;bottom:10px;padding:6px 10px}
  #crumb{font-size:10px}
  #lvlhint{font-size:9px;right:8px;bottom:4px}
}
</style>
</head>
<body>
<div id="hud">
  <h1>MergeTree <b>Explorer</b> <span style="font-size:11px;border:1px solid var(--yellow);color:var(--yellow);border-radius:99px;padding:2px 8px;vertical-align:middle">V2 PREVIEW</span></h1>
  <span class="cap">Part は値グリッド、granule は行、索引はカード。<b style="color:var(--ink)">公式ブログの図の語彙のまま、それが動く</b></span>
  <span id="ctrl" style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button class="btn primary" id="bIns">＋ INSERT</button>
    <button class="btn" id="bMerge">⇄ マージ</button>
    <span style="display:flex;gap:8px;align-items:center;background:#191c23;border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-size:12.5px">
      <span style="font-family:var(--mono);color:var(--muted)">WHERE ts ≧</span>
      <input type="range" id="predR" min="0" max="960" step="15" value="600" style="width:110px;accent-color:#6fe3ff">
      <b id="predV" style="font-family:var(--mono);color:var(--cyan);min-width:44px">18:00</b>
    </span>
    <button class="btn" id="bSel">▶ SELECT</button>
    <button class="btn" id="bAmb">▶ 自動再生</button>
    <button class="btn" id="bReset" title="最初からやり直す">⟳</button>
  </span>
  <div id="sqlbar"></div>
  <div id="resgrid"></div>
  <div id="crumb"><span data-l="0">クラスター</span><i>▸</i><span data-l="1">ノード node-1</span><i>▸</i><span data-l="2" class="on">テーブル otel_events</span></div>
  <div id="steps">
    <span class="step" data-s="1">① 索引分析(二分探索)</span><i>→</i>
    <span class="step" data-s="2">② 対象 granule だけ読む</span><i>→</i>
    <span class="step" data-s="3">③ レーン並列処理(SIMD)</span><i>→</i>
    <span class="step" data-s="4">④ マージして結果を返す</span>
  </div>
</div>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="lvlhint">🔍 スクロール / ピンチ = 粒度を自由に切り替え(操作中もカメラは奪わない) ／ ▶ 自動再生 = カメラ付きツアー</div>

<script>
'use strict';
/* ============================================================
   V2 スパイク(ブログ調): index-based pruning の図をそのまま動かす。
   メタファー無し — Part は値グリッド、granule は 4 値の行、
   primary.idx は g→先頭値 のカード。INSERT の飛来ソート、
   マージの併合、SELECT の索引スキャン→枝刈りをアニメで見せる。
============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,MOB=false;
let CELL=34, CELLH=24, IDXW=104, INS_Y=106;   // モバイルでは resize が縮める
function resize(){ DPR=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);
  MOB=W<700; CELL=MOB?24:34; CELLH=MOB?19:24; IDXW=MOB?78:104;
  if(window.__ready){ updateTop(); layout(); } }
function updateTop(){ INS_Y=Math.max(106, document.getElementById('hud').offsetHeight+8); }
window.addEventListener('resize',resize); resize();

/* ---- カメラ: 連続ズーム。ラベルは画面等倍、粒度は倍率に応じて滑らかに切り替わる ---- */
let cam={x:0,y:0,k:1}, camT=null, crumbLvl=2;
const KMIN=0.24, KMAX=2.5;
function camClamp(){
  cam.k=Math.min(KMAX,Math.max(KMIN,cam.k));
  const x0=-W*1.05, x1=W*2.0, y0=-H*0.7, y1=H*1.5;
  const vw=W/cam.k, vh=H/cam.k;
  cam.x=(vw>=x1-x0)?(x0+x1-vw)/2:Math.min(x1-vw,Math.max(x0,cam.x));
  cam.y=(vh>=y1-y0)?(y0+y1-vh)/2:Math.min(y1-vh,Math.max(y0,cam.y));
}
function zoomAt(px,py,k2){
  k2=Math.min(KMAX,Math.max(KMIN,k2));
  const wx=px/cam.k+cam.x, wy=py/cam.k+cam.y;
  cam.k=k2; cam.x=wx-px/cam.k; cam.y=wy-py/cam.k; camClamp();
}
function camGo(x,y,k,s){ camT={x,y,k,s:s||0.14}; }
function fitRect(x0,y0,x1,y1,s){
  const k=Math.min(KMAX,Math.max(KMIN,Math.min(W/(x1-x0),H/(y1-y0))*0.92));
  camT={k, x:(x0+x1)/2-W/k/2, y:(y0+y1)/2-H/k/2, s:s||0.14};
}
function clientPos(){ return {x:W/2-150, y:INS_Y-300}; }
function camGoLevel(l,slow){
  const s=slow?0.055:0.14;
  if(l===2) camGo(0,0,1,s);
  else if(l===1) fitRect(-110,INS_Y-110,W+110,H+130,s);
  else fitRect(-W*0.55-70,INS_Y-340,W*1.88,H+170,s);
}
document.querySelectorAll('#crumb span').forEach(el=>el.addEventListener('click',()=>camGoLevel(+el.dataset.l)));
function crumbSync(){
  const l=cam.k>0.9?2:(cam.k>0.45?1:0);
  if(l===crumbLvl) return; crumbLvl=l;
  document.querySelectorAll('#crumb span').forEach(el=>el.classList.toggle('on',+el.dataset.l===l));
}
cv.addEventListener('wheel',e=>{ e.preventDefault(); camT=null; zoomAt(e.clientX,e.clientY,cam.k*Math.exp(-e.deltaY*0.0012)); },{passive:false});
cv.addEventListener('dblclick',()=>camGo(0,0,1));
const ptrs=new Map(); let dragPt=null, pinch=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragPt=(ptrs.size===1)?{x:e.clientX,y:e.clientY}:null; pinch=null; camT=null; });
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(pinch){ zoomAt(mx,my,cam.k*(d/pinch.d)); cam.x-=(mx-pinch.mx)/cam.k; cam.y-=(my-pinch.my)/cam.k; camClamp(); }
    pinch={d,mx,my};
  }else if(dragPt){
    cam.x-=(e.clientX-dragPt.x)/cam.k; cam.y-=(e.clientY-dragPt.y)/cam.k; camClamp();
    dragPt={x:e.clientX,y:e.clientY};
  }
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{
  ptrs.delete(e.pointerId); pinch=null;
  dragPt=(ptrs.size===1)?{...[...ptrs.values()][0]}:null;
}));

const MONO=()=>getComputedStyle(document.body).getPropertyValue('--mono');
const JP=()=>getComputedStyle(document.body).getPropertyValue('--jp');

/* ---- 寸法 ---- */
const GAP=3;                        // 値セルの間隔
const GPR=4;                        // granule あたりの値の数(8192 行の縮尺)

/* ---- 状態 ---- */
let seq=0, parts=[], fly=[], lanes=[], result=null, busy=false, simT=640;
let cine=false;   // true = 自動再生ツアー中だけカメラが物語を追う
let pulse=0;      // 要約カードの実行中表示の鼓動
const LANES=3; // max_threads の縮尺
const LANE_COL=['#6fe3ff','#ffb46f','#c9a2ff']; // granule↔レーン(CPU コア)の対応色
function partsBottom(){ return parts.reduce((m,p)=>Math.max(m,p.ty+partH(p)),INS_Y+108); }
function laneGeom(i){
  if(MOB){
    const w=Math.min(420,W-20), h=72; // 薄め(結果テーブルのぶんを下に確保)
    const yTop=Math.min(H-100-(h+8)*LANES, partsBottom()+14);
    return {x:(W-w)/2, y:yTop+i*(h+8), w, h};
  }
  // デスクトップ: レーンは右列に縦積み(Parts 左列と左右で分かれる)
  const px=24+partW(null)+36;
  const w=Math.min(520, W-px-24);
  return {x:px, y:INS_Y+76+i*132, w, h:120};
}
function granRowPos(p,gi){ return {x:p.x+24, y:p.y+30+gi*(CELLH+GAP)}; }
function mkGranules(vals){ const gs=[]; for(let i=0;i<vals.length;i+=GPR) gs.push(vals.slice(i,i+GPR)); return gs; }
function partW(p){ return GPR*(CELL+GAP)+24+IDXW+12+58; }
function partH(p){ return Math.max(p.granules.length*(CELLH+GAP), p.granules.length*16+36)+42; }
function layout(){
  // Parts は縦積みの左列(ストレージ)。デスクトップの右列はレーン(計算)が使う
  const y0=INS_Y+(MOB?98:76), x0=MOB?10:24;
  let y=y0;
  parts.forEach(p=>{
    p.tx=x0; p.ty=y;
    if(p.x==null){ p.x=x0; p.y=-180; }
    y+=partH(p)+16;
  });
}

/* ---- アニメーション駆動 ---- */
function tick(){
  if(camT){
    const s=camT.s||0.14;
    cam.x+=(camT.x-cam.x)*s; cam.y+=(camT.y-cam.y)*s; cam.k+=(camT.k-cam.k)*s;
    if(Math.abs(camT.k-cam.k)<0.003&&Math.abs(camT.x-cam.x)<1.5&&Math.abs(camT.y-cam.y)<1.5){ cam={x:camT.x,y:camT.y,k:camT.k}; camT=null; }
    camClamp();
  }
  crumbSync();
  pulse=(pulse+0.04)%1;
  parts.forEach(p=>{
    p.x+=(p.tx-p.x)*0.12; p.y+=(p.ty-p.y)*0.12;
    if(p.flash>0) p.flash=Math.max(0,p.flash-0.02);
    if(p.dying){ p.alpha=Math.max(0,(p.alpha??1)-0.05); if(p.alpha===0) p.dead=true; }
  });
  const before=parts.length;
  parts=parts.filter(p=>!p.dead);
  if(parts.length!==before) layout();
  lanes.forEach(l=>{ if(l.simd>0) l.simd=Math.max(0,l.simd-0.09); if(l.lastAdd) { l.lastAdd.t-=0.02; if(l.lastAdd.t<=0) l.lastAdd=null; } });
  fly=fly.filter(f=>{
    f.t+=f.dt||0.02;
    const tt=Math.min(1,f.t);
    const e=f.lin?tt:1-Math.pow(1-tt,3); // 旅のチップは等速で「移動」を見せる
    f.x=f.fx+(f.txp-f.fx)*e; f.y=f.fy+(f.typ-f.fy)*e-(f.arc?Math.sin(Math.PI*tt)*f.arc:0);
    if(f.t>=1){ if(f.done){ const fn=f.done; f.done=null; fn(); } return !!f.hold; }
    return true;
  });
}

/* ---- 操作: INSERT(飛来 → ソート → granule 積み込み → 索引構築) ---- */
function doInsert(){
  if(busy){ toast('実行中です','warn'); return; }
  busy=true; clearQueryView();
  const n=8+Math.floor(Math.random()*5);
  simT=Math.min(920,simT+12); // OTel らしく「いまの時刻近辺」が少し乱れて届く
  const vals=Array.from({length:n},()=>Math.max(0,Math.min(959,simT+Math.floor(Math.random()*50)-35)));
  const ord=vals.map((_,i)=>i).sort((a,b)=>vals[a]-vals[b]);
  const rank=[]; ord.forEach((oi,pos)=>rank[oi]=pos);
  const sorted=ord.map(i=>vals[i]);
  const gN=Math.ceil(n/GPR);
  showSql('INSERT INTO otel_events (ts, service, …) VALUES '+vals.slice(0,4).map(v=>"('"+fmtT(v)+"', '"+svcOf(v)+"', …)").join(' ')+' …  -- '+(gN*8192).toLocaleString()+' イベント');
  toast('① INSERT ブロックが届いた順のまま到着。並びはまだバラバラ');
  showMsg('INSERT 実行中…');
  const cx=Math.max(8,W/2-(n*(CELL+GAP))/2), cy=INS_Y+12;
  vals.forEach((v,i)=>{
    fly.push({v, oi:i, fx:W/2+(Math.random()*500-250), fy:-50-Math.random()*90,
      txp:cx+i*(CELL+GAP), typ:cy, t:0, dt:0.024, kind:'raw', hold:true});
  });
  setTimeout(()=>{ // ② ソート(弧を描いて入れ替わる)
    toast('② ORDER BY ts で並べ替え。ソート済みで書き込むから、あとで索引が効く');
    fly.forEach(f=>{ if(f.kind!=='raw') return;
      f.fx=f.x; f.fy=f.y; f.txp=cx+rank[f.oi]*(CELL+GAP); f.typ=cy; f.t=0; f.dt=0.02; f.kind='sorting';
      f.arc=(rank[f.oi]===f.oi)?0:((rank[f.oi]%2?-1:1)*(14+Math.random()*16));
    });
  },1500);
  setTimeout(()=>{ // ③ 8,192 行ごとに granule として Part へ積む
    seq++;
    const p={id:seq,name:'202607_'+seq+'_'+seq+'_0',granules:mkGranules(sorted),lvl:0,flash:0,
      x:null,y:null,building:true,shown:[],idxReveal:0};
    parts.push(p); layout();
    p.x=p.tx; p.y=p.ty; // 確定スロットの位置でそのまま組み立てる(既存 Part と重ねない)
    toast('③ 8,192 行ごとに区切り、granule として Part に積む(セルは各 granule の代表値)');
    let loaded=0;
    fly.forEach(f=>{ if(f.kind!=='sorting') return;
      const pos=rank[f.oi], gi=(pos/GPR)|0, ci=pos%GPR;
      setTimeout(()=>{
        f.fx=f.x; f.fy=f.y; f.arc=0;
        f.txp=p.x+24+ci*(CELL+GAP); f.typ=p.y+30+gi*(CELLH+GAP); f.t=0; f.dt=0.05; f.kind='load'; f.hold=false;
        f.done=()=>{ p.shown[pos]=true; loaded++; if(loaded===n) buildIdx(p); };
      },pos*80);
    });
  },3100);
  function buildIdx(p){ // ④ 各 granule の先頭値 → primary.idx
    toast('④ 各 granule の先頭値だけを primary.idx に記録。行ごとではなく granule ごと1エントリの疎な索引');
    const ix=p.x+24+GPR*(CELL+GAP)+56;
    p.granules.forEach((g,gi)=>{
      setTimeout(()=>{
        fly.push({v:g[0], fx:p.x+24+CELL/2, fy:p.y+30+gi*(CELLH+GAP)+4, txp:ix+8, typ:p.y+48+gi*16, t:0, dt:0.05, kind:'idxv',
          done:()=>{ p.idxReveal=gi+1;
            if(gi===p.granules.length-1){
              p.building=false; p.flash=1; layout();
              showSql('-- 新しい Part '+p.name+'(granule ×'+p.granules.length+' + primary.idx)');
              showMsg('Ok.(新しい Part '+p.name+' / granule ×'+p.granules.length+')');
              busy=false;
              setTimeout(()=>{ if(!busy) showDefaultResult(); },2800);
            } }});
      },gi*300);
    });
  }
}

/* ---- 操作: マージ ---- */
function doMerge(){
  if(busy){ toast('実行中です','warn'); return; }
  const act=parts.filter(p=>!p.dying);
  if(act.length<2){ toast('マージ対象なし(Part が2つ以上必要)','warn'); return; }
  busy=true; clearQueryView();
  const vals=act.flatMap(p=>p.granules.flat()).sort((x,y)=>x-y);
  showSql('OPTIMIZE TABLE events  -- '+act.length+' 個の Part をマージソートで1つに併合');
  showMsg('OPTIMIZE 実行中…');
  act.forEach(p=>{ p.dying=true; });
  const gBefore=act.reduce((s,p)=>s+p.granules.length,0);
  const ids=act.map(p=>p.id), lvl=Math.max(...act.map(p=>p.lvl))+1;
  setTimeout(()=>{
    seq++;
    const p={id:seq,name:'202607_'+Math.min(...ids)+'_'+Math.max(...ids)+'_'+lvl,
      granules:mkGranules(vals),lvl,flash:1,x:null,y:null,merged:true};
    parts.unshift(p); layout();
    const gAfter=p.granules.length;
    toast(act.length+' 個の Part の行を並べ直して1つに置き換え。元の Part は書き換えず引退'+(gAfter<gBefore?'。granule '+gBefore+' → '+gAfter+'(末尾の端数が詰め直された)':''));
    showMsg('Ok.(OPTIMIZE: '+act.length+' Part → 1 Part)');
    busy=false;
    setTimeout(()=>{ if(!busy) showDefaultResult(); },2800);
  },700);
}

/* ---- 操作: SELECT(索引スキャン → 枝刈り) ---- */
let PRED=600;
const BUCKET=60; // 1時間の帯(値 = 8:00 からの経過分)
function fmtT(v){ return (8+Math.floor(v/60))+':'+String(v%60).padStart(2,'0'); }
const SVC=['frontend','checkout','cart','auth','search'];
const svcOf=v=>SVC[v%SVC.length];
function SQLQ(){ return "SELECT toStartOfHour(ts) AS h, count() FROM otel_events WHERE ts >= '"+fmtT(PRED)+"' GROUP BY h ORDER BY h"; }
function clearQueryView(){ // 結果テーブル・レーン・枝刈り表示は次の操作までは残す方針。呼ぶのは各操作の開始時だけ
  result=null; lanes=[]; setStage(0); // カメラは動かさない(粒度はユーザーのもの)
  parts.forEach(p=>{ p.showVerdict=0; p.verdict=null; p.rangeK=null; p.assign=null; p.probe=undefined; p.scanG=undefined; });
}
function hiOf(p,i){ return (i+1<p.granules.length)?p.granules[i+1][0]:960; }
function doSelect(){
  if(busy){ toast('実行中です','warn'); return; }
  const act=parts.filter(p=>!p.dying);
  if(!act.length){ toast('Part がありません。まず INSERT を','warn'); return; }
  busy=true; clearQueryView();
  // 上の SQL ペインがクライアントそのもの。飛来演出は不要になった
  showSql(SQLQ()+';');
  showMsg('実行中…');
  if(cine){ camGoLevel(0,true); setTimeout(()=>camGoLevel(2,true),2200); setTimeout(()=>selExec(act),3200); }
  else setTimeout(()=>selExec(act),250);
}
function selExec(act){
  setStage(1);
  showSql(SQLQ()+'  -- ① 各 Part の primary.idx を二分探索');
  toast('① 索引分析: 各 Part の primary.idx 上で「ts ≧ '+fmtT(PRED)+' を含みうる最初の granule」を二分探索。触るのは索引エントリだけで、値の行はまだ読まない');
  const st=act.map(p=>{
    const n=p.granules.length;
    const s={p,lo:0,hi:n-1,done:false};
    if(n<=1){ s.k=(hiOf(p,0)>=PRED)?0:n; s.done=true; }
    return s;
  });
  const iv=setInterval(()=>{
    let any=false;
    st.forEach(s=>{
      if(s.done){ s.p.probe=undefined; return; }
      any=true;
      const mid=(s.lo+s.hi)>>1;
      s.p.probe=mid;
      if(hiOf(s.p,mid)>=PRED) s.hi=mid; else s.lo=mid+1;
      if(s.lo>=s.hi){
        s.k=(hiOf(s.p,s.lo)>=PRED)?s.lo:s.p.granules.length;
        s.done=true;
      }
    });
    if(!any){
      clearInterval(iv);
      const kept=[];
      st.forEach(s=>{
        const p=s.p, n=p.granules.length, k=s.k;
        p.probe=undefined;
        p.verdict=Array.from({length:n},(_,i)=>i>=k);
        p.rangeK=k; p.showVerdict=1;
        p.granules.forEach((g,gi)=>{ if(gi>=k) kept.push({g,p,gi}); });
      });
      const total=act.reduce((s2,p)=>s2+p.granules.length,0);
      startRead(act,kept,total);
    }
  },700);
}
function startRead(act,kept,total){
  // ② 対象 granule だけをストレージから読む(✂ は読まれない)
  setStage(2);
  const ranges=act.filter(p=>p.rangeK<p.granules.length)
    .map(p=>'g'+(p.rangeK+1)+(p.rangeK+1<p.granules.length?'〜g'+p.granules.length:''));
  showSql(SQLQ()+'  -- ② 読むのは '+kept.length+' / '+total+' granule('+(ranges.join(', ')||'なし')+')');
  toast('② 読み取り: 生き残った granule は<b>連続した range</b>('+(ranges.join(' / ')||'なし')+')としてまとめて読む。✂ の '+(total-kept.length)+' granule には一切触れない');
  if(!kept.length){
    setTimeout(()=>{
      showSql(SQLQ()+'  -- 0 行(索引だけで証明、読み取りゼロ)');
      toast('該当しうる granule がゼロ。ストレージに一切触れず「結果 0 行」を確定してクライアントへ返す');
      result={rows:[]};
      showResult(['toStartOfHour(ts)','count()'],[],'0 rows(索引だけで確定、読み取りゼロ)');
      setTimeout(()=>{ busy=false; },1800);
    },600);
    return;
  }
  lanes=Array.from({length:LANES},(_,i)=>({i,queue:[],cur:null,simd:0,partial:{},fed:0}));
  let arrived=0;
  kept.forEach((k,idx)=>{
    const lane=lanes.reduce((a,b)=>a.fed<=b.fed?a:b); // 動的配分(空いているレーンへ)
    lane.fed++;
    if(!k.p.assign) k.p.assign={};
    k.p.assign[k.gi]=lane.i;
    const src=granRowPos(k.p,k.gi);
    const lg=laneGeom(lane.i);
    setTimeout(()=>{
      fly.push({cells:k.g, col:LANE_COL[lane.i], fx:src.x, fy:src.y, txp:lg.x+12, typ:lg.y+34, t:0, dt:0.022, kind:'gran',
        done:()=>{ lane.queue.push({cells:k.g}); arrived++; if(arrived===kept.length) startProcess(act,kept.length,total); }});
    }, idx*90);
  });
}
function startProcess(act,keptN,total){
  // ③ ベクトル化実行: レーンごとに granule を SIMD で一括評価し、部分集計を積む
  setStage(3);
  showSql(SQLQ()+'  -- ③ '+LANES+' レーンが並列にベクトル化実行(SIMD)');
  toast('③ 並列処理: granule は '+LANES+' 本のレーン(= max_threads、それぞれ CPU コア上のスレッド)へ動的に配分。色が granule とレーンの対応。各レーンは束を SIMD で一括評価し、自分の部分集計を持つ');
  const proc=setInterval(()=>{
    let active=false;
    lanes.forEach(l=>{
      if(l.simd>0){ active=true; return; }           // 評価アニメ中
      if(l.cur){ // 評価完了 → bucket ごとの部分集計へ
        const hits=l.cur.cells.filter(v=>v>=PRED);
        hits.forEach(v=>{ const b=Math.floor(v/BUCKET)*BUCKET; l.partial[b]=(l.partial[b]||0)+8192/GPR; }); // b = 時間帯(60分)
        if(hits.length) l.lastAdd={v:hits.length*8192/GPR,t:1};
        l.cur=null;
      }
      if(l.queue.length){ l.cur=l.queue.shift(); l.simd=1; active=true; }
    });
    if(!active&&fly.every(f=>f.kind!=='gran')){
      clearInterval(proc);
      const merged={};
      lanes.forEach(l=>Object.keys(l.partial).forEach(b=>{ merged[b]=(merged[b]||0)+l.partial[b]; }));
      const rows=Object.keys(merged).map(Number).sort((a,b)=>a-b).map(b=>[b,merged[b]]);
      const cnt=rows.reduce((s,r)=>s+r[1],0);
      setStage(4);
      showSql(SQLQ()+'  -- ④ 部分集計をマージ → '+rows.length+' 行の結果を返す');
      toast('④ 各レーンの部分集計(user_id を '+BUCKET+' 刻みの帯 = bucket ごとの件数)をマージし、1つの結果テーブルとしてクライアントへ返す。読んだのは '+keptN+' / '+total+' granule');
      let got=0;
      const mx=W/2, my=INS_Y+30; // ノード上端の合流点(マージが済んだ瞬間、上の結果ペインが埋まる)
      lanes.forEach(l=>{
        const g=laneGeom(l.i);
        const sum=Object.keys(l.partial).reduce((s,b)=>s+l.partial[b],0);
        fly.push({kind:'chip', col:LANE_COL[l.i], txt:sum.toLocaleString(),
          fx:g.x+g.w*0.87, fy:g.y+g.h/2, txp:mx, typ:my, t:0, dt:0.028,
          done:()=>{ got++; if(got===LANES){
            result={rows};
            showResult(['toStartOfHour(ts)','count()'], rows.map(r=>[fmtT(r[0])+'〜', r[1].toLocaleString()]), rows.length+' rows');
            toast('④ 時間帯ごとの部分集計をマージ → 結果は上の結果ペイン(=クライアント)へ。SQL → 索引 → granule → レーン → マージ → 結果、がクエリの一生');
          } }});
      });
      setTimeout(()=>{
        if(cine){ camGoLevel(0,true); setTimeout(()=>{ camGo(0,0,1,0.05); busy=false; },4600); }
        else busy=false;
      },cine?2200:1800);
    }
  },380);
}
/* ---- 描画 ---- */
function cellColor(v){ return 'hsl('+(205+v/1000*35)+' 16% 20%)'; }
function drawPart(p){
  const w=partW(p), h=partH(p);
  ctx.globalAlpha=p.alpha??1;
  ctx.fillStyle='#14161b';
  ctx.strokeStyle=p.merged?'#faff69':'#262a33';
  ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); ctx.stroke();
  if(p.flash>0){ ctx.fillStyle='rgba(125,255,178,'+(p.flash*0.25)+')'; ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); }
  ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
  ctx.fillText('Part '+p.name+' ('+(p.granules.length*8192).toLocaleString()+' 行)'+(p.lvl>0?'  マージ産':''), p.x+10, p.y+17);
  const gx=p.x+24, gy=p.y+30;
  ctx.fillStyle='#4d5563'; ctx.font='8px '+MONO();
  ctx.fillText('ts', gx+2, p.y+27);
  p.granules.forEach((g,gi)=>{
    const ry=gy+gi*(CELLH+GAP);
    const scanned=p.scanG===gi;
    const laneNo=p.assign?p.assign[gi]:null;
    if(laneNo!=null){ ctx.fillStyle=LANE_COL[laneNo]; ctx.fillRect(p.x+2,ry+2,3,CELLH-4); }
    ctx.fillStyle=scanned?'#faff69':(laneNo!=null?LANE_COL[laneNo]:'#707a8c'); ctx.font='10px '+MONO();
    ctx.fillText('g'+(gi+1), p.x+6, ry+15);
    g.forEach((v,ci)=>{
      const cxp=gx+ci*(CELL+GAP);
      if(p.building&&!p.shown[gi*GPR+ci]){
        ctx.strokeStyle='#232733'; ctx.setLineDash([3,3]);
        ctx.strokeRect(cxp+0.5,ry+0.5,CELL-1,CELLH-1); ctx.setLineDash([]); return;
      }
      let fill=cellColor(v), tcol='#e8eaf0', dead=false;
      if(p.showVerdict&&p.verdict){
        if(!p.verdict[gi]){ fill='#141519'; tcol='#494f5e'; dead=true; }
        else if(v>=PRED){ fill='#153a2a'; tcol='#7dffb2'; }
        else { fill='#1b2431'; tcol='#8b93a5'; }
      }
      ctx.fillStyle=fill;
      ctx.beginPath(); ctx.roundRect(cxp,ry,CELL,CELLH,4); ctx.fill();
      if(scanned){ ctx.strokeStyle='#faff69'; ctx.strokeRect(cxp+0.5,ry+0.5,CELL-1,CELLH-1); }
      ctx.fillStyle=tcol; ctx.font=(MOB?'7.5px ':'9.5px ')+MONO(); ctx.textAlign='center';
      ctx.fillText(fmtT(v), cxp+CELL/2, ry+CELLH-8+(MOB?1:0)); ctx.textAlign='left';
    });
    // 縮尺の明示: セルは代表値で、1行 = 8,192 行。刈られた行は ✂
    const pruned=p.showVerdict&&p.verdict&&!p.verdict[gi];
    ctx.fillStyle=pruned?'#ff7d7d':'#4d5563'; ctx.font='9px '+MONO();
    ctx.fillText(pruned?'✂ 8,192行':'…8,192行', gx+GPR*(CELL+GAP)+2, ry+15);
  });
  const ix=gx+GPR*(CELL+GAP)+56, iy=p.y+30;
  const ih=p.granules.length*16+34;
  ctx.fillStyle='#1a1c10'; ctx.strokeStyle='#8a8f3a';
  ctx.beginPath(); ctx.roundRect(ix,iy,IDXW,ih,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#faff69'; ctx.font='700 10px '+MONO();
  ctx.fillText('primary.idx', ix+8, iy+14);
  p.granules.forEach((g,gi)=>{
    if(p.building&&gi>=p.idxReveal) return;
    const probing=p.probe===gi;
    const inRange=p.showVerdict&&p.verdict&&p.verdict[gi];
    if(probing){ ctx.fillStyle='rgba(250,255,105,.18)'; ctx.fillRect(ix+3,iy+18+gi*16,IDXW-6,14); }
    if(inRange){ ctx.fillStyle='#7dffb2'; ctx.fillRect(ix+3,iy+18+gi*16,2,14); }
    ctx.fillStyle=probing?'#faff69':(inRange?'#d5f6c9':'#b9bd7a');
    ctx.font=(probing?'700 ':'')+'10px '+MONO();
    ctx.fillText('g'+(gi+1)+' → '+fmtT(g[0])+(probing?' ?':''), ix+8, iy+28+gi*16);
  });
  if(p.showVerdict&&p.rangeK!=null&&p.rangeK<p.granules.length){
    ctx.fillStyle='#6fe3ff'; ctx.font='700 9px '+MONO();
    ctx.fillText('range: g'+(p.rangeK+1)+'〜g'+p.granules.length, ix+8, iy+ih-6);
  }
  ctx.globalAlpha=1;
}
function drawLanes(){
  if(!lanes.length) return;
  lanes.forEach(l=>{
    const g=laneGeom(l.i);
    ctx.fillStyle='#111319'; ctx.strokeStyle='#262a33';
    ctx.beginPath(); ctx.roundRect(g.x,g.y,g.w,g.h,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle=LANE_COL[l.i]; ctx.beginPath(); ctx.arc(g.x+14,g.y+13,4,0,7); ctx.fill();
    ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
    ctx.fillText('processing lane '+(l.i+1)+' = CPU コア', g.x+24, g.y+17);
    // 3工程のゾーン: 受取待ち | SIMD 一括評価 | 部分集計
    const zoneY=g.y+24, zoneH=g.h-46;
    const z1w=g.w*0.24, z2w=g.w*0.44, z3w=g.w*0.26;
    const z1x=g.x+8, z2x=z1x+z1w+10, z3x=z2x+z2w+10;
    // ゾーン枠
    [[z1x,z1w,'#262a33'],[z2x,z2w,l.simd>0?LANE_COL[l.i]:'#262a33'],[z3x,z3w,'#2f5c41']].forEach(([zx,zw,col])=>{
      ctx.strokeStyle=col; ctx.setLineDash([3,3]);
      ctx.strokeRect(zx,zoneY,zw,zoneH); ctx.setLineDash([]);
    });
    // ① 受取待ち(キューの mini 行)
    l.queue.slice(0,MOB?2:3).forEach((q,qi)=>{
      const my=zoneY+5+qi*12;
      q.cells.forEach((v,ci)=>{
        ctx.globalAlpha=0.35; ctx.fillStyle=LANE_COL[l.i];
        ctx.fillRect(z1x+5+ci*((z1w-14)/GPR), my, (z1w-14)/GPR-2, 9);
        ctx.globalAlpha=1;
      });
    });
    const qShown=MOB?2:3;
    if(l.queue.length>qShown){ ctx.fillStyle='#5a6478'; ctx.font='9px '+MONO(); ctx.fillText('+'+(l.queue.length-qShown), z1x+5, zoneY+zoneH-4); }
    // ② SIMD 一括評価(現在の granule)
    if(l.cur){
      const cw=(z2w-16)/GPR, cy2=zoneY+(zoneH-CELLH)/2;
      l.cur.cells.forEach((v,ci)=>{
        const cxp=z2x+8+ci*cw;
        const hit=v>=PRED;
        ctx.fillStyle=l.simd>0?(hit?'rgba(125,255,178,'+(0.35+l.simd*0.6)+')':'rgba(111,227,255,'+(0.2+l.simd*0.5)+')'):(hit?'#153a2a':'#1b2431');
        ctx.beginPath(); ctx.roundRect(cxp,cy2,cw-3,CELLH,4); ctx.fill();
        ctx.strokeStyle=LANE_COL[l.i]; ctx.globalAlpha=0.5; ctx.stroke(); ctx.globalAlpha=1;
        ctx.fillStyle=hit?'#7dffb2':'#c7cede'; ctx.font='9px '+MONO(); ctx.textAlign='center';
        ctx.fillText(fmtT(v),cxp+(cw-3)/2,cy2+CELLH/2+4); ctx.textAlign='left';
      });
    }
    // ③ 部分集計(bucket ごと・レーンローカル)
    const ents=Object.keys(l.partial).map(Number).sort((a,b)=>a-b);
    if(!ents.length){
      ctx.fillStyle='#3f664f'; ctx.font='700 12px '+MONO(); ctx.textAlign='center';
      ctx.fillText('—', z3x+z3w/2, zoneY+zoneH/2+4); ctx.textAlign='left';
    }else{
      const maxL=Math.max(1,Math.floor((zoneH-4)/11));
      ctx.textAlign='left'; ctx.font='9px '+MONO();
      ents.slice(0,maxL).forEach((b,ei)=>{
        ctx.fillStyle='#7dffb2';
        ctx.fillText(fmtT(b)+'台 '+l.partial[b].toLocaleString(), z3x+5, zoneY+11+ei*11);
      });
      if(ents.length>maxL){ ctx.fillStyle='#5f8a6f'; ctx.fillText('+'+(ents.length-maxL), z3x+z3w-16, zoneY+zoneH-3); }
    }
    if(l.lastAdd){ ctx.globalAlpha=Math.max(0,l.lastAdd.t); ctx.fillStyle='#7dffb2'; ctx.font='700 11px '+MONO(); ctx.textAlign='center';
      ctx.fillText('+'+l.lastAdd.v.toLocaleString(), z3x+z3w/2, zoneY+zoneH/2+4-10*(1-l.lastAdd.t)); ctx.globalAlpha=1; ctx.textAlign='left'; }
    // ゾーンのキャプションと矢印
    ctx.fillStyle='#5a6478'; ctx.font='9px '+JP();
    ctx.fillText('受取待ち', z1x+2, g.y+g.h-8);
    ctx.fillStyle=l.simd>0?'#6fe3ff':'#5a6478';
    ctx.fillText('SIMD 一括評価(束ごと)', z2x+2, g.y+g.h-8);
    ctx.fillStyle='#5a6478';
    ctx.fillText('部分集計', z3x+2, g.y+g.h-8);
    ctx.fillStyle='#3a4152'; ctx.font='11px '+MONO();
    ctx.fillText('→', z2x-9, zoneY+zoneH/2+4);
    ctx.fillText('→', z3x-9, zoneY+zoneH/2+4);
  });
}

function lvlStats(){
  const act=parts.filter(p=>!p.dying);
  const g=act.reduce((s,p)=>s+p.granules.length,0);
  return {act, n:act.length, g, rows:g*8192};

  ctx.beginPath(); ctx.moveTo(W/2,cp.y+96); ctx.lineTo(W/2,INS_Y-70); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#57617a'; ctx.font=fz(9)+'px '+JP();
  ctx.fillText('SQL ↓ ／ 結果 ↑', W/2+14, (cp.y+96+INS_Y-70)/2);
  // Keeper ×3(協調サービス。入れ子ではなく並存)
  ctx.fillStyle='#8b93a5'; ctx.font='700 '+fz(11)+'px '+JP();
  ctx.fillText('ClickHouse Keeper(協調サービス)', kx, INS_Y-fz(6));
  for(let i=0;i<3;i++){
    const ky=INS_Y+10+i*88;
    ctx.fillStyle='#12151c'; ctx.strokeStyle='#3a4152';
    ctx.beginPath(); ctx.roundRect(kx,ky,300,68,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#c7cede'; ctx.font='700 '+fz(11)+'px '+MONO();
    ctx.fillText('keeper-'+(i+1), kx+fz(10), ky+fz(24));
    ctx.strokeStyle='#2a3242'; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(kx+300,ky+34); ctx.lineTo(-80,INS_Y+150); ctx.stroke(); ctx.setLineDash([]);
  }
  // レプリカ node-2(簡略)
  const n2x=W+150, n2y=INS_Y+10, n2w=Math.max(500,W*0.5), n2h=330;
  ctx.fillStyle='#0f1116'; ctx.strokeStyle='#2a3242';
  ctx.beginPath(); ctx.roundRect(n2x,n2y,n2w,n2h,16); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8b93a5'; ctx.font='700 '+fz(14)+'px '+JP();
  ctx.fillText('ノード node-2(レプリカ)', n2x+fz(12), n2y+fz(26));
  for(let i=0;i<3;i++){
    ctx.fillStyle='#14161b'; ctx.strokeStyle='#262a33';
    ctx.beginPath(); ctx.roundRect(n2x+30+i*130,n2y+70,110,60,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#4d5563'; ctx.font='700 '+fz(9)+'px '+MONO();
    ctx.fillText('Part', n2x+30+i*130+fz(8), n2y+70+fz(20));
  }
  ctx.fillStyle='#57617a'; ctx.font=fz(10)+'px '+JP();
  ctx.fillText('Replicated テーブルなら node-1 と同じ Part 群を複製保持', n2x+fz(12), n2y+180+fz(10));
  ctx.strokeStyle='#2a3242'; ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(W+80,INS_Y+180); ctx.lineTo(n2x,n2y+150); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#57617a'; ctx.font=fz(9)+'px '+JP();
  ctx.fillText('レプリケーション(Keeper 経由で調整)', W+90, INS_Y+170);
  ctx.globalAlpha=1;
}
function drawNodeSummary(){
  // シーンが読めない倍率では、実物の上に要約カードを重ねる(粒度の連続切り替え)
  const a=Math.max(0,Math.min(1,(0.52-cam.k)/0.16));
  if(a<=0.02) return;
  const fz=s=>s/Math.max(cam.k,KMIN);
  const s=lvlStats();
  const x=W*0.05, y=INS_Y+30, w=W*0.9, hh=(H-INS_Y)*0.6;
  ctx.globalAlpha=a;
  ctx.fillStyle='#101319f0'; ctx.strokeStyle='#2a3242';
  ctx.beginPath(); ctx.roundRect(x,y,w,hh,fz(8)); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8eaf0'; ctx.font='700 '+fz(15)+'px '+JP(); ctx.textAlign='left';
  ctx.fillText('テーブル otel_events(要約)', x+fz(14), y+fz(26));
  ctx.fillStyle='#c7cede'; ctx.font='700 '+fz(11)+'px '+MONO();
  ctx.fillText('Part ×'+s.n+' ・ granule ×'+s.g+' ・ '+s.rows.toLocaleString()+' 行', x+fz(14), y+fz(48));
  const bw=fz(50), bh=fz(30), gp=fz(9);
  const maxB=Math.max(1,Math.floor((w-fz(28))/(bw+gp)));
  s.act.slice(0,maxB).forEach((p,i)=>{
    ctx.fillStyle='#1b2431'; ctx.strokeStyle='#3a4152';
    ctx.beginPath(); ctx.roundRect(x+fz(14)+i*(bw+gp), y+fz(60), bw, bh, fz(5)); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#98a0b3'; ctx.font='700 '+fz(9)+'px '+MONO(); ctx.textAlign='center';
    ctx.fillText(p.granules.length+' g', x+fz(14)+i*(bw+gp)+bw/2, y+fz(60)+bh/2+fz(3)); ctx.textAlign='left';
  });
  if(busy&&curStage>0){
    const names=['','① 索引分析(二分探索)','② 対象 granule だけ読み取り','③ レーン(CPU コア)で並列処理','④ 部分集計をマージ → 結果を返却'];
    const gA=0.55+0.45*Math.sin(pulse*Math.PI*2);
    ctx.strokeStyle='rgba(250,255,105,'+(gA*a).toFixed(3)+')';
    ctx.beginPath(); ctx.roundRect(x,y,w,hh,fz(8)); ctx.stroke();
    ctx.fillStyle='#faff69'; ctx.font='700 '+fz(12)+'px '+JP();
    ctx.fillText('実行中: '+names[curStage], x+fz(14), y+hh-fz(34));
  }
  ctx.fillStyle='#6fe3ff'; ctx.font='700 '+fz(10)+'px '+JP();
  ctx.fillText('▶ ズームイン(またはダブルクリック)で Part / granule の実物へ', x+fz(14), y+hh-fz(12));
  ctx.globalAlpha=1;
}
function resY(n){
  const hgt=46+Math.max(1,n)*17;
  if(MOB&&lanes.length){ const g=laneGeom(LANES-1); return Math.min(g.y+g.h+10, H-hgt-10); } // レーンの下
  return Math.min(partsBottom()+14, H-hgt-40); // Parts の直下(画面下端には張り付けない)
}
function drawResult(){
  if(!result) return;
  result.a=Math.min(1,(result.a??0)+0.05);
  const rows=result.rows, w=MOB?210:250, rh=17;
  const hgt=46+Math.max(1,rows.length)*rh;
  const x=W/2-w/2, y=resY(rows.length);
  ctx.globalAlpha=result.a;
  ctx.fillStyle='#101a13'; ctx.strokeStyle='#2f5c41';
  ctx.beginPath(); ctx.roundRect(x,y,w,hgt,10); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#7dffb2'; ctx.font='700 11px '+JP(); ctx.textAlign='center';
  ctx.fillText('結果テーブル → クライアントへ', x+w/2, y+16);
  ctx.font='700 10px '+MONO(); ctx.fillStyle='#5f8a6f';
  ctx.textAlign='left'; ctx.fillText('user_id 帯(bucket)', x+18, y+32);
  ctx.textAlign='right'; ctx.fillText('count()', x+w-18, y+32);
  ctx.strokeStyle='#24402f'; ctx.beginPath(); ctx.moveTo(x+10,y+37.5); ctx.lineTo(x+w-10,y+37.5); ctx.stroke();
  if(!rows.length){ ctx.fillStyle='#5f8a6f'; ctx.font='10px '+MONO(); ctx.textAlign='center'; ctx.fillText('(0 行)', x+w/2, y+52); }
  rows.forEach((r,ri)=>{
    ctx.fillStyle='#d5f6c9'; ctx.font='11px '+MONO();
    ctx.textAlign='left'; ctx.fillText(r[0]+'〜'+(r[0]+BUCKET-1), x+18, y+52+ri*rh);
    ctx.textAlign='right'; ctx.fillText(r[1].toLocaleString(), x+w-18, y+52+ri*rh);
  });
  ctx.textAlign='left'; ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.scale(cam.k,cam.k); ctx.translate(-cam.x,-cam.y);
  drawOutside();
  ctx.strokeStyle='#1d2331'; ctx.setLineDash([5,5]);
  ctx.strokeRect(12,INS_Y,W-24,48); ctx.setLineDash([]);
  ctx.fillStyle='#5a6478'; ctx.font='10px '+JP(); ctx.textAlign='left';
  ctx.fillText('INSERT ブロック(届いた順) → ソート → granule 区切り', 18, INS_Y+14);
  if(MOB){
    ctx.fillStyle='#8b93a5'; ctx.font='700 9px '+MONO();
    ctx.fillText('otel_events(ts DateTime, service, …) ORDER BY ts', 12, INS_Y+60);
    ctx.fillStyle='#5a6478'; ctx.font='9px '+JP();
    ctx.fillText('セルは ts(時刻)。1行 = granule = 8,192 イベントの窓', 12, INS_Y+72);
  }else{
    ctx.fillStyle='#8b93a5'; ctx.font='700 11px '+MONO();
    ctx.fillText('otel_events(ts DateTime, service, …) ORDER BY ts', 18, INS_Y+62);
    ctx.fillStyle='#5a6478'; ctx.font='10px '+JP();
    ctx.fillText('セルは ts(時刻)。1行 = granule = 8,192 イベントの窓', 350, INS_Y+62);
  }
  parts.forEach(drawPart);
  drawLanes();
  drawNodeSummary();
  fly.forEach(f=>{
    if(f.kind==='chip'){
      const sc=1/Math.max(cam.k,0.55); // ズームアウト中も画面上で同じ大きさに見せる
      ctx.font='700 '+(11*sc)+'px '+MONO();
      const tw=ctx.measureText(f.txt).width+18*sc;
      ctx.fillStyle='#101a13'; ctx.strokeStyle=f.col; ctx.lineWidth=sc;
      ctx.beginPath(); ctx.roundRect(f.x-tw/2,f.y-11*sc,tw,22*sc,11*sc); ctx.fill(); ctx.stroke();
      ctx.lineWidth=1;
      ctx.fillStyle='#7dffb2'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y+4*sc); ctx.textAlign='left';
      return;
    }
    if(f.kind==='gran'){
      f.cells.forEach((v,ci)=>{
        ctx.fillStyle='#1b2c3a'; ctx.strokeStyle=f.col||'#3d8ba3';
        ctx.beginPath(); ctx.roundRect(f.x+ci*(CELL*0.7),f.y,CELL*0.65,CELLH*0.8,3); ctx.fill(); ctx.stroke();
      });
      return;
    }
    if(f.kind==='idxv'){
      ctx.fillStyle='#faff69'; ctx.font='700 10px '+MONO(); ctx.textAlign='left';
      ctx.fillText(fmtT(f.v), f.x, f.y+10);
      return;
    }
    const srt=f.kind==='sorting'||f.kind==='load';
    ctx.fillStyle=srt?'#153a2a':'#1b2431';
    ctx.strokeStyle=srt?'#7dffb2':'#3a4152';
    ctx.beginPath(); ctx.roundRect(f.x,f.y,CELL,CELLH,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e8eaf0'; ctx.font='9px '+MONO(); ctx.textAlign='center';
    ctx.fillText(fmtT(f.v), f.x+CELL/2, f.y+16); ctx.textAlign='left';
  });
  ctx.restore();
}
function loop(){ tick(); render(); requestAnimationFrame(loop); }

/* ---- HUD ---- */
const sqlEl=document.getElementById('sqlbar'), toastEl=document.getElementById('toast');
let toastT=null;
function showSql(s){ sqlEl.textContent=s; }
const resEl=document.getElementById('resgrid');
function showResult(cols,rows,note){
  let html='<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ html+='<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>'; });
  html+='</table>';
  if(note) html+='<div class="msg">'+note+'</div>';
  resEl.innerHTML=html;
}
function showMsg(m){ resEl.innerHTML='<div class="msg">'+m+'</div>'; }
function showDefaultResult(){ // 初期クエリ = テーブル構造の紹介
  showSql('SELECT * FROM otel_events LIMIT 10;');
  showResult(['ts','service','…'], tableSample(10).map(v=>[fmtT(v),svcOf(v),'…']), '10 rows(代表値)');
}
let curStage=0;
function setStage(n){ // 0 = 非表示
  curStage=n;
  const box=document.getElementById('steps');
  if(n===0){ box.classList.remove('show'); return; }
  box.classList.add('show');
  box.querySelectorAll('.step').forEach(el=>{
    const s=+el.dataset.s;
    el.classList.toggle('on',s===n);
    el.classList.toggle('done',s<n);
  });
  const on=box.querySelector('.step.on');
  if(on) on.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function toast(s,warn){ toastEl.textContent=s; toastEl.className=warn?'on warn':'on'; toastEl.id='toast'; clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),6200); }
document.getElementById('bIns').addEventListener('click',doInsert);
document.getElementById('bMerge').addEventListener('click',doMerge);
document.getElementById('bSel').addEventListener('click',doSelect);
document.getElementById('predR').addEventListener('input',()=>{ PRED=+document.getElementById('predR').value; document.getElementById('predV').textContent=fmtT(PRED); });
let demoT=null, demoSteps=null;
function stopDemo(){ if(demoT){ clearInterval(demoT); demoT=null; demoSteps=null; cine=false; document.getElementById('bAmb').textContent='▶ 自動再生'; } }
document.getElementById('bAmb').addEventListener('click',()=>{
  if(demoT){ stopDemo(); return; }
  demoSteps=['insert','insert','merge','select'];
  cine=true; // ツアー中だけカメラが物語を追う
  document.getElementById('bAmb').textContent='⏹ 停止';
  demoT=setInterval(()=>{
    if(demoSteps.length===0){ if(result&&!busy) stopDemo(); return; } // 帰還まで見届けて終了
    if(busy) return;
    const s=demoSteps.shift();
    if(s==='insert') doInsert(); else if(s==='merge') doMerge(); else doSelect();
  },900);
});
document.getElementById('bReset').addEventListener('click',()=>{
  if(busy){ toast('実行中です。終わってからリセットを','warn'); return; }
  stopDemo();
  parts=[]; fly=[]; lanes=[]; result=null; seq=0; setStage(0);
  seedParts(); layout(); parts.forEach(p=>{ p.x=p.tx; p.y=p.ty; });
  showDefaultResult();
  toast('初期状態に戻した。INSERT → マージ → SELECT をもう一度最初から試せる');
});

/* ---- 初期状態(ブログの例と同じ気分の値) ---- */
function seedParts(){
  const mk=(vals,lvl,name)=>{ seq++; const p={id:seq,name,granules:mkGranules(vals.sort((a,b)=>a-b)),lvl,flash:0,x:null,y:null,merged:lvl>0}; parts.push(p); };
  mk([40,100,400,40,700,400,40,500,900,50,300,600],2,'202607_1_5_2');
  mk([60,300,600,60,500,900,60,900,620],0,'202607_6_6_0');
}
(function init(){
  seedParts();
  window.__ready=true; updateTop();
  new ResizeObserver(()=>{ updateTop(); layout(); }).observe(document.getElementById('hud'));
  layout(); parts.forEach(p=>{ p.x=p.tx; p.y=p.ty; });
  showDefaultResult();
  window.__v2={ get parts(){return parts;} };
  loop();
})();
</script>
