<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeTree Explorer V2 | ClickHouse ストレージが動いて見える</title>
<style>
:root{
  --bg:#0c0d10; --panel:#14161bee; --line:#262a33; --ink:#e8eaf0; --muted:#98a0b3;
  --yellow:#faff69; --cyan:#6fe3ff; --green:#7dffb2; --red:#ff7d7d; --dim:#707a8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp)}
canvas{display:block;touch-action:none;cursor:grab}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:14px;align-items:center;padding:12px 18px;background:linear-gradient(#0c0d10f0,#0c0d1000);z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud h1{font-size:18px;margin:0;white-space:nowrap}
#hud h1 b{color:var(--yellow)}
#hud .cap{font-size:12px;color:var(--muted)}
.btn{background:#191c23;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--jp);white-space:nowrap;touch-action:manipulation}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1c1c05}
#hud{flex-wrap:wrap}
#sqlbar{flex-basis:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--cyan);white-space:nowrap;overflow-x:auto}
#sqlbar .cm{color:var(--dim)}
#resgrid{flex-basis:100%;background:#101a13;border:1px solid #2f5c41;border-radius:10px;padding:6px 14px;font-family:var(--mono);font-size:12px;color:#d5f6c9;height:104px;overflow:auto;margin-top:-4px}
#resgrid table{border-collapse:collapse}
#resgrid th{color:#5f8a6f;text-align:left;font-size:10px;border-bottom:1px solid #24402f;padding:1px 26px 2px 0;font-weight:700}
#resgrid td{padding:1px 26px 1px 0;white-space:nowrap}
#resgrid .msg{color:#5f8a6f;font-size:11px;padding:2px 0}
#steps{flex-basis:100%;display:none;gap:8px;align-items:center;font-size:12px;color:var(--dim);font-family:var(--jp)}
#steps.show{display:flex}
#steps i{font-style:normal;color:#3a4152}
#steps .step{border:1px solid var(--line);border-radius:99px;padding:3px 12px;white-space:nowrap}
#steps .step.on{border-color:var(--yellow);color:var(--yellow)}
#steps .step.done{border-color:#2f5c41;color:var(--green)}
#steps .step.done::after{content:" ✓"}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink);z-index:10;opacity:0;transition:opacity .25s;max-width:94vw}
#toast.on{opacity:1}
#toast.warn{border-color:var(--red);color:var(--red)}
@media (max-width:700px){
  #hud{gap:8px;padding:8px 10px}
  #hud h1{font-size:15px}
  #hud .cap{display:none}
  #ctrl{margin-left:0 !important;flex-basis:100%;flex-wrap:wrap;gap:6px !important}
  .btn{padding:7px 10px;font-size:12px}
  #ctrl>span{padding:4px 8px !important;font-size:11.5px !important}
  #predR{width:70px !important}
  #sqlbar{font-size:11px;padding:6px 10px}
  #resgrid{height:64px;font-size:10.5px;padding:4px 10px}
  #steps{font-size:10.5px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #steps .step{padding:2px 8px}
  #toast{font-size:12px;bottom:10px;padding:6px 10px}
}
</style>
</head>
<body>
<div id="hud">
  <h1>MergeTree <b>Explorer</b> <span style="font-size:11px;border:1px solid #6fe3ff;color:#6fe3ff;border-radius:99px;padding:2px 8px;vertical-align:middle">V3 3D TEST</span></h1>
  <span class="cap">Part は値グリッド、granule は行、索引はカード。<b style="color:var(--ink)">公式ブログの図の語彙のまま、それが動く</b></span>
  <span id="ctrl" style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <select id="engSel" style="background:#0f1116;color:#98a0b3;border:1px solid #262a33;border-radius:8px;font-family:var(--mono);font-size:11px;padding:6px 4px">
      <option value="mt">MergeTree</option><option value="rmt">ReplacingMT</option>
    </select>
    <button class="btn primary" id="bIns">＋ INSERT</button>
    <button class="btn" id="bMerge">⇄ マージ</button>
    <button class="btn" id="bDel">🗑 DELETE</button>
    <button class="btn" id="bUpd">✏️ UPDATE</button>
    <button class="btn" id="bProj">⚡ PROJECTION</button>
    <span style="display:flex;gap:8px;align-items:center;background:#191c23;border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-size:12.5px">
      <span style="font-family:var(--mono);color:var(--muted)">WHERE ts ≧</span>
      <input type="range" id="predR" min="0" max="960" step="15" value="600" style="width:110px;accent-color:#6fe3ff">
      <b id="predV" style="font-family:var(--mono);color:var(--cyan);min-width:44px">18:00</b>
      <span style="font-family:var(--mono);color:var(--muted)">AND service =</span>
      <select id="svcSel" style="background:#0f1116;color:#6fe3ff;border:1px solid #262a33;border-radius:6px;font-family:var(--mono);font-size:11.5px;padding:2px 4px">
        <option value="">(すべて)</option><option>frontend</option><option>checkout</option><option>cart</option><option>auth</option><option>search</option>
      </select>
      <span style="font-family:var(--mono);color:var(--muted)">idx:</span>
      <select id="idxSel" style="background:#0f1116;color:#c9a2ff;border:1px solid #262a33;border-radius:6px;font-family:var(--mono);font-size:11.5px;padding:2px 4px">
        <option value="set">set</option><option value="bloom">bloom_filter</option>
      </select>
    </span>
    <button class="btn" id="bSel">▶ SELECT</button>
    <button class="btn" id="bAmb">▶ 自動再生</button>
    <button class="btn" id="bReset" title="最初からやり直す">⟳</button>
  </span>
  <div id="sqlbar"></div>
  <div id="resgrid"></div>
  <div id="steps">
    <span class="step" data-s="1">① 索引分析(二分探索)</span><i>→</i>
    <span class="step" data-s="2">② 対象 granule だけ読む</span><i>→</i>
    <span class="step" data-s="3">③ レーン並列処理(SIMD)</span><i>→</i>
    <span class="step" data-s="4">④ マージして結果を返す</span>
  </div>
</div>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="v3hint" style="position:fixed;right:12px;bottom:12px;font-size:10px;color:#57617a;z-index:9;pointer-events:none;font-family:var(--jp)">🎥 ドラッグ = 回転 ／ ホイール / ピンチ = ズーム(カードは常に正面を向く)</div>

<script>
'use strict';
/* ============================================================
   V2 スパイク(ブログ調): index-based pruning の図をそのまま動かす。
   メタファー無し — Part は値グリッド、granule は 4 値の行、
   primary.idx は g→先頭値 のカード。INSERT の飛来ソート、
   マージの併合、SELECT の索引スキャン→枝刈りをアニメで見せる。
============================================================ */
const cv=document.getElementById('cv');
let ctx=document.createElement('canvas').getContext('2d'); // カードのテクスチャ描画用に差し替えて使う
let W=0,H=0,DPR=1,MOB=false;
let CELL=34, CELLH=24, IDXW=104, SKW=88, INS_Y=106;   // モバイルでは resize が縮める
function resize(){ DPR=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;
  MOB=W<700; CELL=MOB?24:34; CELLH=MOB?19:24; IDXW=MOB?78:104; SKW=MOB?72:88;
  if(window.__r3resize) window.__r3resize();
  if(window.__ready){ updateTop(); layout(); } }
function updateTop(){ INS_Y=Math.max(106, document.getElementById('hud').offsetHeight+8); }
window.addEventListener('resize',resize); resize();

const MONO=()=>getComputedStyle(document.body).getPropertyValue('--mono');
const JP=()=>getComputedStyle(document.body).getPropertyValue('--jp');

/* ---- 寸法 ---- */
const GAP=3;                        // 値セルの間隔
const GPR=4;                        // granule あたりの値の数(8192 行の縮尺)

/* ---- 状態 ---- */
let seq=0, parts=[], fly=[], lanes=[], result=null, busy=false, simT=640;
let mv={}, mvFlash=0;   // MV hourly_counts(書き込み時に集計)
let mv2={}, mv2Flash=0; // MV daily_counts(hourly からのカスケード)
let projOn=false;       // ADD PROJECTION 済みか
let ENG='mt', mutSeq=6;  // ENGINE(mt/rmt) と mutation バージョン
let pulse=0;      // 要約カードの実行中表示の鼓動
const LANES=3; // max_threads の縮尺
const LANE_COL=['#6fe3ff','#ffb46f','#c9a2ff']; // granule↔レーン(CPU コア)の対応色
function partsBottom(){ return parts.reduce((m,p)=>Math.max(m,p.ty+partH(p)),INS_Y+108); }
function laneGeom(i){
  if(MOB){
    const w=Math.min(420,W-20), h=72; // 薄め(結果テーブルのぶんを下に確保)
    const yTop=Math.min(H-100-(h+8)*LANES, partsBottom()+14);
    return {x:(W-w)/2, y:yTop+i*(h+8), w, h};
  }
  // デスクトップ: レーンは右列に縦積み(Parts 左列と左右で分かれる)
  const px=24+partW(null)+36;
  const w=Math.min(520, W-px-24);
  return {x:px, y:INS_Y+76+i*132, w, h:120};
}
function granRowPos(p,gi){ return {x:p.x+24, y:p.y+30+gi*(CELLH+GAP)}; }
function mkGranules(vals){ const gs=[]; for(let i=0;i<vals.length;i+=GPR) gs.push(vals.slice(i,i+GPR)); return gs; }
function partW(p){ return GPR*(CELL+GAP)+24+56+IDXW+10+SKW+10; }
function partH(p){ return Math.max(p.granules.length*(CELLH+GAP), p.granules.length*16+36)+42; }
function layout(){
  // Parts は縦積みの左列(ストレージ)。デスクトップの右列はレーン(計算)が使う
  const y0=INS_Y+(MOB?98:76), x0=MOB?10:24;
  let y=y0;
  parts.forEach(p=>{
    p.tx=x0; p.ty=y;
    if(p.x==null){ p.x=x0; p.y=-180; }
    y+=partH(p)+16;
  });
}

/* ---- アニメーション駆動 ---- */
function tick(){
  parts.forEach(p=>{
    p.x+=(p.tx-p.x)*0.12; p.y+=(p.ty-p.y)*0.12;
    if(p.flash>0) p.flash=Math.max(0,p.flash-0.02);
    if(p.dying){ p.alpha=Math.max(0,(p.alpha??1)-0.05); if(p.alpha===0) p.dead=true; }
  });
  const before=parts.length;
  parts=parts.filter(p=>!p.dead);
  if(parts.length!==before) layout();
  if(mvFlash>0) mvFlash=Math.max(0,mvFlash-0.03);
  if(mv2Flash>0) mv2Flash=Math.max(0,mv2Flash-0.03);
  lanes.forEach(l=>{ if(l.simd>0) l.simd=Math.max(0,l.simd-0.09); if(l.lastAdd) { l.lastAdd.t-=0.02; if(l.lastAdd.t<=0) l.lastAdd=null; } });
  const dones=[]; // done の中で fly.push しても消えないよう、filter 後に実行
  fly=fly.filter(f=>{
    f.t+=f.dt||0.02;
    const tt=Math.min(1,f.t);
    const e=f.lin?tt:1-Math.pow(1-tt,3); // 旅のチップは等速で「移動」を見せる
    f.x=f.fx+(f.txp-f.fx)*e; f.y=f.fy+(f.typ-f.fy)*e-(f.arc?Math.sin(Math.PI*tt)*f.arc:0);
    if(f.t>=1){ if(f.done){ dones.push(f.done); f.done=null; } return !!f.hold; }
    return true;
  });
  dones.forEach(fn=>fn());
}

/* ---- 操作: INSERT(飛来 → ソート → granule 積み込み → 索引構築) ---- */
function doInsert(){
  if(busy){ toast('実行中です','warn'); return; }
  busy=true; clearQueryView();
  const n=8+Math.floor(Math.random()*5);
  simT=Math.min(920,simT+12); // OTel らしく「いまの時刻近辺」が少し乱れて届く
  const vals=Array.from({length:n},()=>Math.max(0,Math.min(959,simT+Math.floor(Math.random()*50)-35)));
  const ord=vals.map((_,i)=>i).sort((a,b)=>vals[a]-vals[b]);
  const rank=[]; ord.forEach((oi,pos)=>rank[oi]=pos);
  const sorted=ord.map(i=>vals[i]);
  const gN=Math.ceil(n/GPR);
  showSql('INSERT INTO otel_events (ts, service, …) VALUES '+vals.slice(0,4).map(v=>"('"+fmtT(v)+"', '"+svcOf(v)+"', …)").join(' ')+' …  -- '+(gN*8192).toLocaleString()+' イベント');
  toast('① INSERT ブロックが届いた順のまま到着。並びはまだバラバラ');
  showMsg('INSERT 実行中…');
  const cx=Math.max(8,W/2-(n*(CELL+GAP))/2), cy=INS_Y+12;
  vals.forEach((v,i)=>{
    fly.push({v, oi:i, fx:W/2+(Math.random()*500-250), fy:-50-Math.random()*90,
      txp:cx+i*(CELL+GAP), typ:cy, t:0, dt:0.024, kind:'raw', hold:true});
  });
  setTimeout(()=>{ // ② ソート(弧を描いて入れ替わる)
    toast('② ORDER BY ts で並べ替え。ソート済みで書き込むから、あとで索引が効く');
    fly.forEach(f=>{ if(f.kind!=='raw') return;
      f.fx=f.x; f.fy=f.y; f.txp=cx+rank[f.oi]*(CELL+GAP); f.typ=cy; f.t=0; f.dt=0.02; f.kind='sorting';
      f.arc=(rank[f.oi]===f.oi)?0:((rank[f.oi]%2?-1:1)*(14+Math.random()*16));
    });
  },1500);
  setTimeout(()=>{ // ③ 8,192 行ごとに granule として Part へ積む
    seq++;
    const p={id:seq,name:TODAY+'_'+seq+'_'+seq+'_0',day:TODAY,hasProj:projOn,granules:mkGranules(sorted),lvl:0,flash:0,
      x:null,y:null,building:true,shown:[],idxReveal:0};
    parts.push(p); layout();
    p.x=p.tx; p.y=p.ty; // 確定スロットの位置でそのまま組み立てる(既存 Part と重ねない)
    toast('③ 8,192 行ごとに区切り、granule として Part に積む(セルは各 granule の代表値)');
    let loaded=0;
    fly.forEach(f=>{ if(f.kind!=='sorting') return;
      const pos=rank[f.oi], gi=(pos/GPR)|0, ci=pos%GPR;
      setTimeout(()=>{
        f.fx=f.x; f.fy=f.y; f.arc=0;
        f.txp=p.x+24+ci*(CELL+GAP); f.typ=p.y+30+gi*(CELLH+GAP); f.t=0; f.dt=0.05; f.kind='load'; f.hold=false;
        f.done=()=>{ p.shown[pos]=true; loaded++; if(loaded===n) buildIdx(p); };
      },pos*80);
    });
  },3100);
  function buildIdx(p){ // ④ 各 granule の先頭値 → primary.idx
    toast('④ 各 granule の先頭値だけを primary.idx に記録。行ごとではなく granule ごと1エントリの疎な索引');
    const ix=p.x+24+GPR*(CELL+GAP)+56;
    p.granules.forEach((g,gi)=>{
      setTimeout(()=>{
        fly.push({v:g[0], fx:p.x+24+CELL/2, fy:p.y+30+gi*(CELLH+GAP)+4, txp:ix+8, typ:p.y+48+gi*16, t:0, dt:0.05, kind:'idxv',
          done:()=>{ p.idxReveal=gi+1;
            if(gi===p.granules.length-1){
              p.building=false; p.flash=1; layout();
              showSql('-- 新しい Part '+p.name+'(granule ×'+p.granules.length+' + primary.idx)');
              showMsg('Ok.(新しい Part '+p.name+' / granule ×'+p.granules.length+')');
              { const mg=mvGeom(); // MV はクエリ時ではなく書き込み時に集計が走る
                fly.push({kind:'chip', col:'#c9a2ff', txt:'→ MV へも自動集計', fx:p.x+170, fy:p.y+10, txp:mg.x+mg.w/2, typ:mg.y+16, t:0, dt:0.02,
                  done:()=>{ sorted.forEach(v=>{ const b=Math.floor(v/BUCKET)*BUCKET; mv[b]=(mv[b]||0)+8192/GPR; }); mvFlash=1;
                    toast('MV hourly_counts: INSERT と同時に集計済みの行が積まれた。SELECT のたびに数え直さなくてよくなる');
                    const gm=mvGeom(), g2=mv2Geom(), tot=sorted.length*(8192/GPR);
                    fly.push({kind:'chip', col:'#c9a2ff', txt:'カスケード → daily', fx:gm.x+gm.w/2, fy:g2.y-14, txp:g2.x+g2.w/2, typ:g2.y+14, t:0, dt:0.03,
                      done:()=>{ mv2[TODAY]=(mv2[TODAY]||0)+tot; mv2Flash=1; }}); }});
              }
              busy=false;
              setTimeout(()=>{ if(!busy) showDefaultResult(); },2800);
            } }});
      },gi*300);
    });
  }
}

/* ---- 操作: マージ ---- */
function doMerge(){
  if(busy){ toast('実行中です','warn'); return; }
  const byDay={};
  parts.filter(p=>!p.dying).forEach(p=>(byDay[p.day]=byDay[p.day]||[]).push(p));
  const day=Object.keys(byDay).sort((a,b)=>byDay[b].length-byDay[a].length)[0];
  const act=byDay[day]||[];
  if(act.length<2){ toast('マージ対象なし(同じパーティション内に Part が2つ以上必要)','warn'); return; }
  busy=true; clearQueryView();
  const delN=act.reduce((s,p)=>s+(p.del?Object.keys(p.del).length:0),0);
  let vals=act.flatMap(p=>p.granules.flatMap((g,gi)=>g.filter((v,ci)=>!(p.del&&p.del[gi*GPR+ci])))).sort((x,y)=>x-y);
  let dedup=0;
  if(ENG==='rmt'){ const before=vals.length; vals=vals.filter((v,i)=>i===0||v!==vals[i-1]); dedup=before-vals.length; }
  showSql('OPTIMIZE TABLE otel_events PARTITION \''+day+'\'  -- '+act.length+' 個の Part を併合(パーティションは跨がない)');
  showMsg('OPTIMIZE 実行中…');
  act.forEach(p=>{ p.dying=true; });
  const gBefore=act.reduce((s,p)=>s+p.granules.length,0);
  const ids=act.map(p=>p.id), lvl=Math.max(...act.map(p=>p.lvl))+1;
  setTimeout(()=>{
    seq++;
    const p={id:seq,name:day+'_'+Math.min(...ids)+'_'+Math.max(...ids)+'_'+lvl,day,
      granules:mkGranules(vals),lvl,flash:1,x:null,y:null,merged:true};
    parts.unshift(p); layout();
    const gAfter=p.granules.length;
    toast(act.length+' 個の Part の行を並べ直して1つに置き換え。元の Part は書き換えず引退'+(gAfter<gBefore?'。granule '+gBefore+' → '+gAfter+'(末尾の端数が詰め直された)':'')+(delN?'。マスク済み '+(delN*8192/GPR).toLocaleString()+' 行をここで物理削除':'')+(dedup?'。ReplacingMergeTree: 同じ ts の '+(dedup*8192/GPR).toLocaleString()+' 行を置換(重複解消はマージ時=eventually)':''));
    showMsg('Ok.(OPTIMIZE: '+act.length+' Part → 1 Part)');
    busy=false;
    setTimeout(()=>{ if(!busy) showDefaultResult(); },2800);
  },700);
}

/* ---- 操作: UPDATE(mutation = Part の書き換え) ---- */
function doUpdate(){
  if(busy){ toast('実行中です','warn'); return; }
  const target=SVCF||'cart';
  const hit=parts.filter(p=>!p.dying&&p.granules.some(g=>g.some(v=>svcOf(v)===target)));
  if(!hit.length){ toast('該当行を含む Part がない(service = '+target+')','warn'); return; }
  busy=true; clearQueryView();
  mutSeq++;
  showSql("ALTER TABLE otel_events UPDATE attrs['tier'] = 'vip' WHERE service = '"+target+"'  -- mutation");
  showMsg('mutation 実行中…(system.mutations: is_done = 0)');
  toast('UPDATE は mutation: マスクではなく、該当行を含む Part を丸ごと新しい Part に書き換える(重い)。名前に mutation バージョンが付く');
  let done=0;
  hit.forEach((p,i)=>setTimeout(()=>{
    p.dying=true;
    seq++;
    const np={id:seq, name:p.name+'_'+mutSeq, day:p.day, hasProj:p.hasProj, del:p.del,
      granules:p.granules.map(g=>g.slice()), lvl:p.lvl, flash:1, x:p.x, y:p.y, merged:p.merged, upd:{}};
    np.granules.forEach((g,gi)=>g.forEach((v,ci)=>{ if(svcOf(v)===target) np.upd[gi*GPR+ci]=true; }));
    parts.splice(parts.indexOf(p),0,np); layout();
    done++;
    if(done===hit.length){ showMsg('Ok. mutation 完了('+hit.length+' Part を書き換え、水色 = 更新行)'); busy=false; }
  }, i*500));
}

/* ---- 操作: 軽量 DELETE(_row_exists マスク) ---- */
function doDelete(){
  if(busy){ toast('実行中です','warn'); return; }
  const target=SVCF||'cart';
  busy=true; clearQueryView();
  showSql("DELETE FROM otel_events WHERE service = '"+target+"'  -- 軽量削除(_row_exists でマスク)");
  let n=0;
  parts.filter(p=>!p.dying).forEach(p=>{
    p.del=p.del||{};
    p.granules.forEach((g,gi)=>g.forEach((v,ci)=>{ const key=gi*GPR+ci; if(!p.del[key]&&svcOf(v)===target){ p.del[key]=true; n++; } }));
  });
  toast('軽量 DELETE: 行は Part の中に残ったまま、_row_exists のマスクが付いただけ(取り消し線)。物理削除は次のマージのとき');
  showMsg('Ok. '+(n*8192/GPR).toLocaleString()+" 行をマスク(service = '"+target+"')");
  setTimeout(()=>{ busy=false; },900);
}

/* ---- 操作: SELECT(索引スキャン → 枝刈り) ---- */
let PRED=600;
const TODAY='20260729', YDAY='20260728'; // PARTITION BY toDate(ts)
const BUCKET=60; // 1時間の帯(値 = 8:00 からの経過分)
function fmtT(v){ return (8+Math.floor(v/60))+':'+String(v%60).padStart(2,'0'); }
const SVC=['frontend','checkout','cart','auth','search'];
const svcOf=v=>SVC[v%SVC.length];
const SVA=['fe','ch','ca','au','se'];
let IDXT='set'; // skip index の種類: set(正確) / bloom_filter(偽陽性あり)
function granSvcs(g){ const s=new Set(); g.forEach(v=>{ if(v!=null) s.add(v%SVC.length); }); return s; }
function bloomBits(s){ let b=0; s.forEach(i=>{ b|=(1<<(i%8))|(1<<((i*3+2)%8)); }); return b; }
function idxMayContain(g,target){
  const ti=SVC.indexOf(target), s=granSvcs(g);
  if(IDXT==='set') return s.has(ti);
  const tb=(1<<(ti%8))|(1<<((ti*3+2)%8));
  return (bloomBits(s)&tb)===tb; // 部分集合なら「含むかも」= 偽陽性がありうる
}
function SQLQ(){ return "SELECT toStartOfHour(ts) AS h, count() FROM otel_events WHERE ts >= '2026-07-29 "+fmtT(PRED)+"'"+(SVCF?" AND service = '"+SVCF+"'":'')+" GROUP BY h ORDER BY h"; }
function clearQueryView(){ // 結果テーブル・レーン・枝刈り表示は次の操作までは残す方針。呼ぶのは各操作の開始時だけ
  result=null; lanes=[]; setStage(0); // カメラは動かさない(粒度はユーザーのもの)
  parts.forEach(p=>{ p.showVerdict=0; p.verdict=null; p.rangeK=null; p.assign=null; p.skipx=null; p.partPruned=0; p.probe=undefined; p.scanG=undefined; });
}
function hiOf(p,i){ return (i+1<p.granules.length)?p.granules[i+1][0]:960; }
function doSelect(){
  if(busy){ toast('実行中です','warn'); return; }
  const act=parts.filter(p=>!p.dying);
  if(!act.length){ toast('Part がありません。まず INSERT を','warn'); return; }
  busy=true; clearQueryView();
  // 上の SQL ペインがクライアントそのもの。飛来演出は不要になった
  showSql(SQLQ()+';');
  showMsg('実行中…');
  setTimeout(()=>selExec(act),250);
}
function selExec(act){
  setStage(1);
  // まずパーティション枝刈り: 日付条件に合わない partition は索引すら見ない
  const pp=act.filter(p=>p.day!==TODAY);
  pp.forEach(p=>{ p.partPruned=1; p.showVerdict=1; p.verdict=p.granules.map(()=>false); p.rangeK=p.granules.length; });
  act=act.filter(p=>p.day===TODAY);
  showSql(SQLQ()+'  -- ① partition 枝刈り → 各 Part の primary.idx を二分探索');
  toast('① 索引分析: まず minmax(toDate(ts)) でパーティションを枝刈り'+(pp.length?'('+YDAY+' は丸ごと対象外)':'')+'。残った Part の primary.idx で「ts ≧ '+fmtT(PRED)+'」を二分探索');
  const st=act.map(p=>{
    const n=p.granules.length;
    const s={p,lo:0,hi:n-1,done:false};
    if(n<=1){ s.k=(hiOf(p,0)>=PRED)?0:n; s.done=true; }
    return s;
  });
  const iv=setInterval(()=>{
    let any=false;
    st.forEach(s=>{
      if(s.done){ s.p.probe=undefined; return; }
      any=true;
      const mid=(s.lo+s.hi)>>1;
      s.p.probe=mid;
      if(hiOf(s.p,mid)>=PRED) s.hi=mid; else s.lo=mid+1;
      if(s.lo>=s.hi){
        s.k=(hiOf(s.p,s.lo)>=PRED)?s.lo:s.p.granules.length;
        s.done=true;
      }
    });
    if(!any){
      clearInterval(iv);
      const kept=[];
      st.forEach(s=>{
        const p=s.p, n=p.granules.length, k=s.k;
        p.probe=undefined;
        p.verdict=Array.from({length:n},(_,i)=>i>=k);
        p.skipx={};
        p.rangeK=k; p.showVerdict=1;
        p.granules.forEach((g,gi)=>{
          if(gi<k) return;
          // skip index(set / bloom_filter)。「含まない」と言い切れた granule は読まない
          if(SVCF && !idxMayContain(g,SVCF)){ p.skipx[gi]=true; p.verdict[gi]=false; return; }
          kept.push({g:g.map((v,ci)=>(p.del&&p.del[gi*GPR+ci])?null:v),p,gi}); // マスク行は null
        });
      });
      const total=act.reduce((s2,p)=>s2+p.granules.length,0);
      startRead(act,kept,total);
    }
  },700);
}
function startRead(act,kept,total){
  // ② 対象 granule だけをストレージから読む(✂ は読まれない)
  setStage(2);
  const ranges=act.filter(p=>p.rangeK<p.granules.length)
    .map(p=>'g'+(p.rangeK+1)+(p.rangeK+1<p.granules.length?'〜g'+p.granules.length:''));
  showSql(SQLQ()+'  -- ② 読むのは '+kept.length+' / '+total+' granule('+(ranges.join(', ')||'なし')+')');
  toast('② 読み取り: 生き残った granule('+(ranges.join(' / ')||'なし')+')だけ読む。✂ '+(total-kept.length)+' granule はスキップ'+(SVCF?'(赤 = 主キー、オレンジ = service の '+(IDXT==='set'?'set':'bloom_filter')+' skip index'+(IDXT==='bloom'?'。bloom は偽陽性がありうる = 読んでから空振りすることもある':'')+')':''));
  if(!kept.length){
    setTimeout(()=>{
      showSql(SQLQ()+'  -- 0 行(索引だけで証明、読み取りゼロ)');
      toast('該当しうる granule がゼロ。ストレージに一切触れず「結果 0 行」を確定してクライアントへ返す');
      result={rows:[]};
      showResult(['toStartOfHour(ts)','count()'],[],'0 rows(索引だけで確定、読み取りゼロ)');
      setTimeout(()=>{ busy=false; },1800);
    },600);
    return;
  }
  lanes=Array.from({length:LANES},(_,i)=>({i,queue:[],cur:null,simd:0,partial:{},fed:0}));
  let arrived=0;
  kept.forEach((k,idx)=>{
    const lane=lanes.reduce((a,b)=>a.fed<=b.fed?a:b); // 動的配分(空いているレーンへ)
    lane.fed++;
    if(!k.p.assign) k.p.assign={};
    k.p.assign[k.gi]=lane.i;
    const src=granRowPos(k.p,k.gi);
    const lg=laneGeom(lane.i);
    setTimeout(()=>{
      fly.push({cells:k.g, col:LANE_COL[lane.i], fx:src.x, fy:src.y, txp:lg.x+12, typ:lg.y+34, t:0, dt:0.022, kind:'gran',
        done:()=>{ lane.queue.push({cells:k.g}); arrived++; if(arrived===kept.length) startProcess(act,kept.length,total); }});
    }, idx*90);
  });
}
function startProcess(act,keptN,total){
  // ③ ベクトル化実行: レーンごとに granule を SIMD で一括評価し、部分集計を積む
  setStage(3);
  showSql(SQLQ()+'  -- ③ '+LANES+' レーンが並列にベクトル化実行(SIMD)');
  toast('③ 並列処理: granule は '+LANES+' 本のレーン(= max_threads、それぞれ CPU コア上のスレッド)へ動的に配分。色が granule とレーンの対応。各レーンは束を SIMD で一括評価し、自分の部分集計を持つ');
  const proc=setInterval(()=>{
    let active=false;
    lanes.forEach(l=>{
      if(l.simd>0){ active=true; return; }           // 評価アニメ中
      if(l.cur){ // 評価完了 → bucket ごとの部分集計へ
        const hits=l.cur.cells.filter(v=>v!=null&&v>=PRED&&(!SVCF||svcOf(v)===SVCF));
        hits.forEach(v=>{ const b=Math.floor(v/BUCKET)*BUCKET; l.partial[b]=(l.partial[b]||0)+8192/GPR; }); // b = 時間帯(60分)
        if(hits.length) l.lastAdd={v:hits.length*8192/GPR,t:1};
        l.cur=null;
      }
      if(l.queue.length){ l.cur=l.queue.shift(); l.simd=1; active=true; }
    });
    if(!active&&fly.every(f=>f.kind!=='gran')){
      clearInterval(proc);
      const merged={};
      lanes.forEach(l=>Object.keys(l.partial).forEach(b=>{ merged[b]=(merged[b]||0)+l.partial[b]; }));
      const rows=Object.keys(merged).map(Number).sort((a,b)=>a-b).map(b=>[b,merged[b]]);
      const cnt=rows.reduce((s,r)=>s+r[1],0);
      setStage(4);
      showSql(SQLQ()+'  -- ④ 部分集計をマージ → '+rows.length+' 行の結果を返す');
      toast('④ 各レーンの部分集計(user_id を '+BUCKET+' 刻みの帯 = bucket ごとの件数)をマージし、1つの結果テーブルとしてクライアントへ返す。読んだのは '+keptN+' / '+total+' granule');
      let got=0;
      const mx=W/2, my=INS_Y+30; // ノード上端の合流点(マージが済んだ瞬間、上の結果ペインが埋まる)
      lanes.forEach(l=>{
        const g=laneGeom(l.i);
        const sum=Object.keys(l.partial).reduce((s,b)=>s+l.partial[b],0);
        fly.push({kind:'chip', col:LANE_COL[l.i], txt:sum.toLocaleString(),
          fx:g.x+g.w*0.87, fy:g.y+g.h/2, txp:mx, typ:my, t:0, dt:0.028,
          done:()=>{ got++; if(got===LANES){
            result={rows};
            showResult(['toStartOfHour(ts)','count()'], rows.map(r=>[fmtT(r[0])+'〜', r[1].toLocaleString()]), rows.length+' rows');
            toast('④ 時間帯ごとの部分集計をマージ → 結果は上の結果ペイン(=クライアント)へ。SQL → 索引 → granule → レーン → マージ → 結果、がクエリの一生');
          } }});
      });
      setTimeout(()=>{ busy=false; },1800);
    }
  },380);
}
/* ---- 描画 ---- */
function cellColor(v){ return 'hsl('+(205+v/1000*35)+' 16% 20%)'; }
function drawPart(p){
  const w=partW(p), h=partH(p);
  ctx.globalAlpha=(p.alpha??1)*(p.partPruned?0.45:1);
  ctx.fillStyle='#14161b';
  ctx.strokeStyle=p.merged?'#faff69':'#262a33';
  ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); ctx.stroke();
  if(p.flash>0){ ctx.fillStyle='rgba(125,255,178,'+(p.flash*0.25)+')'; ctx.beginPath(); ctx.roundRect(p.x,p.y,w,h,10); ctx.fill(); }
  ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
  ctx.fillText('Part '+p.name+' ('+(p.granules.length*8192).toLocaleString()+' 行)'+(p.lvl>0?'  マージ産':''), p.x+10, p.y+17);
  if(p.partPruned){ ctx.fillStyle='#ff7d7d'; ctx.font='700 9px '+MONO(); ctx.textAlign='right';
    ctx.fillText('✂ partition', p.x+w-8, p.y+17); ctx.textAlign='left'; }
  const gx=p.x+24, gy=p.y+30;
  ctx.fillStyle='#4d5563'; ctx.font='8px '+MONO();
  ctx.fillText('ts', gx+2, p.y+27);
  p.granules.forEach((g,gi)=>{
    const ry=gy+gi*(CELLH+GAP);
    const scanned=p.scanG===gi;
    const laneNo=p.assign?p.assign[gi]:null;
    if(laneNo!=null){ ctx.fillStyle=LANE_COL[laneNo]; ctx.fillRect(p.x+2,ry+2,3,CELLH-4); }
    ctx.fillStyle=scanned?'#faff69':(laneNo!=null?LANE_COL[laneNo]:'#707a8c'); ctx.font='10px '+MONO();
    ctx.fillText('g'+(gi+1), p.x+6, ry+15);
    g.forEach((v,ci)=>{
      const cxp=gx+ci*(CELL+GAP);
      if(p.building&&!p.shown[gi*GPR+ci]){
        ctx.strokeStyle='#232733'; ctx.setLineDash([3,3]);
        ctx.strokeRect(cxp+0.5,ry+0.5,CELL-1,CELLH-1); ctx.setLineDash([]); return;
      }
      let fill=cellColor(v), tcol='#e8eaf0', dead=false;
      const isDel=p.del&&p.del[gi*GPR+ci];
      if(isDel){ fill='#191014'; tcol='#7a5560'; }
      const isUpd=p.upd&&p.upd[gi*GPR+ci];
      if(isUpd&&!isDel){ fill='#12333a'; tcol='#7de3ff'; }
      if(p.showVerdict&&p.verdict){
        if(!p.verdict[gi]){ fill='#141519'; tcol='#494f5e'; dead=true; }
        else if(v>=PRED){ fill='#153a2a'; tcol='#7dffb2'; }
        else { fill='#1b2431'; tcol='#8b93a5'; }
      }
      ctx.fillStyle=fill;
      ctx.beginPath(); ctx.roundRect(cxp,ry,CELL,CELLH,4); ctx.fill();
      if(scanned){ ctx.strokeStyle='#faff69'; ctx.strokeRect(cxp+0.5,ry+0.5,CELL-1,CELLH-1); }
      ctx.fillStyle=tcol; ctx.font=(MOB?'7.5px ':'9.5px ')+MONO(); ctx.textAlign='center';
      ctx.fillText(fmtT(v), cxp+CELL/2, ry+CELLH-8+(MOB?1:0)); ctx.textAlign='left';
      if(isDel){ ctx.strokeStyle='rgba(255,125,125,.6)';
        ctx.beginPath(); ctx.moveTo(cxp+4,ry+CELLH/2); ctx.lineTo(cxp+CELL-4,ry+CELLH/2); ctx.stroke(); }
    });
    // 縮尺の明示: セルは代表値で、1行 = 8,192 行。刈られた行は ✂
    const pruned=p.showVerdict&&p.verdict&&!p.verdict[gi];
    const bySkip=pruned&&p.skipx&&p.skipx[gi];
    ctx.fillStyle=bySkip?'#ffb46f':(pruned?'#ff7d7d':'#4d5563'); ctx.font='9px '+MONO();
    ctx.fillText(p.partPruned?'✂ partition':(bySkip?'✂ skip idx':(pruned?'✂ 8,192行':'…8,192行')), gx+GPR*(CELL+GAP)+2, ry+15);
  });
  const ix=gx+GPR*(CELL+GAP)+56, iy=p.y+30;
  const ih=p.granules.length*16+34;
  ctx.fillStyle='#1a1c10'; ctx.strokeStyle='#8a8f3a';
  ctx.beginPath(); ctx.roundRect(ix,iy,IDXW,ih,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#faff69'; ctx.font='700 10px '+MONO();
  ctx.fillText('primary.idx', ix+8, iy+14);
  p.granules.forEach((g,gi)=>{
    if(p.building&&gi>=p.idxReveal) return;
    const probing=p.probe===gi;
    const inRange=p.showVerdict&&p.verdict&&p.verdict[gi];
    if(probing){ ctx.fillStyle='rgba(250,255,105,.18)'; ctx.fillRect(ix+3,iy+18+gi*16,IDXW-6,14); }
    if(inRange){ ctx.fillStyle='#7dffb2'; ctx.fillRect(ix+3,iy+18+gi*16,2,14); }
    ctx.fillStyle=probing?'#faff69':(inRange?'#d5f6c9':'#b9bd7a');
    ctx.font=(probing?'700 ':'')+'10px '+MONO();
    ctx.fillText('g'+(gi+1)+' → '+fmtT(g[0])+(probing?' ?':''), ix+8, iy+28+gi*16);
  });
  if(p.showVerdict&&p.rangeK!=null&&p.rangeK<p.granules.length){
    ctx.fillStyle='#6fe3ff'; ctx.font='700 9px '+MONO();
    ctx.fillText('range: g'+(p.rangeK+1)+'〜g'+p.granules.length, ix+8, iy+ih-6);
  }
  if(p.hasProj){ ctx.fillStyle='#c9a2ff'; ctx.font='700 8px '+MONO();
    ctx.fillText('⚡proj: ORDER BY service のコピーを内蔵', p.x+8, p.y+partH(p)-8); }
  // skip idx カード(service 列の副次索引): set は中身、bloom はビット列
  const kx2=ix+IDXW+10;
  ctx.fillStyle='#1a1420'; ctx.strokeStyle='#8a6fb0';
  ctx.beginPath(); ctx.roundRect(kx2,iy,SKW,ih,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#c9a2ff'; ctx.font='700 9px '+MONO();
  ctx.fillText('skip idx', kx2+6, iy+14);
  ctx.fillStyle='#6e5a8a'; ctx.font='7px '+MONO();
  ctx.fillText(IDXT==='set'?'set(service)':'bloom(service)', kx2+6, iy+14+8);
  p.granules.forEach((g,gi)=>{
    if(p.building&&gi>=p.idxReveal) return;
    const skipped=p.showVerdict&&p.skipx&&p.skipx[gi];
    if(skipped){ ctx.fillStyle='rgba(255,180,111,.16)'; ctx.fillRect(kx2+3,iy+26+gi*16-10,SKW-6,13); }
    ctx.fillStyle=skipped?'#ffb46f':'#a08cc0'; ctx.font='7.5px '+MONO();
    const s=[...granSvcs(g)].sort();
    const txt=IDXT==='set' ? '{'+s.map(i=>SVA[i]).join(',')+'}' : bloomBits(new Set(s)).toString(2).padStart(8,'0');
    ctx.fillText(txt, kx2+6, iy+28+gi*16);
  });
  ctx.globalAlpha=1;
}
function drawLanes(){
  if(!lanes.length){ // 待機中も枠を見せて配置を安定させる(モバイルは MV と場所を共有するので出さない)
    if(MOB) return;
    for(let i=0;i<LANES;i++){
      const g=laneGeom(i);
      ctx.strokeStyle='#1d2331'; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.roundRect(g.x,g.y,g.w,g.h,10); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#3a4152'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
      ctx.fillText('processing lane '+(i+1)+' = CPU コア', g.x+10, g.y+17);
      ctx.fillStyle='#2e3542'; ctx.font='10px '+JP();
      ctx.fillText('SELECT 実行時、対象の granule だけがここへ流れて SIMD で評価される', g.x+10, g.y+g.h/2+6);
    }
    return;
  }
  lanes.forEach(l=>{
    const g=laneGeom(l.i);
    ctx.fillStyle='#111319'; ctx.strokeStyle='#262a33';
    ctx.beginPath(); ctx.roundRect(g.x,g.y,g.w,g.h,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle=LANE_COL[l.i]; ctx.beginPath(); ctx.arc(g.x+14,g.y+13,4,0,7); ctx.fill();
    ctx.fillStyle='#98a0b3'; ctx.font='700 11px '+MONO(); ctx.textAlign='left';
    ctx.fillText('processing lane '+(l.i+1)+' = CPU コア', g.x+24, g.y+17);
    // 3工程のゾーン: 受取待ち | SIMD 一括評価 | 部分集計
    const zoneY=g.y+24, zoneH=g.h-46;
    const z1w=g.w*0.24, z2w=g.w*0.44, z3w=g.w*0.26;
    const z1x=g.x+8, z2x=z1x+z1w+10, z3x=z2x+z2w+10;
    // ゾーン枠
    [[z1x,z1w,'#262a33'],[z2x,z2w,l.simd>0?LANE_COL[l.i]:'#262a33'],[z3x,z3w,'#2f5c41']].forEach(([zx,zw,col])=>{
      ctx.strokeStyle=col; ctx.setLineDash([3,3]);
      ctx.strokeRect(zx,zoneY,zw,zoneH); ctx.setLineDash([]);
    });
    // ① 受取待ち(キューの mini 行)
    l.queue.slice(0,MOB?2:3).forEach((q,qi)=>{
      const my=zoneY+5+qi*12;
      q.cells.forEach((v,ci)=>{
        ctx.globalAlpha=0.35; ctx.fillStyle=LANE_COL[l.i];
        ctx.fillRect(z1x+5+ci*((z1w-14)/GPR), my, (z1w-14)/GPR-2, 9);
        ctx.globalAlpha=1;
      });
    });
    const qShown=MOB?2:3;
    if(l.queue.length>qShown){ ctx.fillStyle='#5a6478'; ctx.font='9px '+MONO(); ctx.fillText('+'+(l.queue.length-qShown), z1x+5, zoneY+zoneH-4); }
    // ② SIMD 一括評価(現在の granule)
    if(l.cur){
      const cw=(z2w-16)/GPR, cy2=zoneY+(zoneH-CELLH)/2;
      l.cur.cells.forEach((v,ci)=>{
        const cxp=z2x+8+ci*cw;
        if(v==null){ ctx.fillStyle='#141519'; ctx.beginPath(); ctx.roundRect(cxp,cy2,cw-3,CELLH,4); ctx.fill(); return; }
        const hit=v>=PRED;
        ctx.fillStyle=l.simd>0?(hit?'rgba(125,255,178,'+(0.35+l.simd*0.6)+')':'rgba(111,227,255,'+(0.2+l.simd*0.5)+')'):(hit?'#153a2a':'#1b2431');
        ctx.beginPath(); ctx.roundRect(cxp,cy2,cw-3,CELLH,4); ctx.fill();
        ctx.strokeStyle=LANE_COL[l.i]; ctx.globalAlpha=0.5; ctx.stroke(); ctx.globalAlpha=1;
        ctx.fillStyle=hit?'#7dffb2':'#c7cede'; ctx.font='9px '+MONO(); ctx.textAlign='center';
        ctx.fillText(fmtT(v),cxp+(cw-3)/2,cy2+CELLH/2+4); ctx.textAlign='left';
      });
    }

  const n=p.granules.length, h=34+n*22+18;
  return {tex:makeText(150,h,g=>{
    g.fillStyle='#1a1c10'; g.fillRect(0,0,150,h);
    g.strokeStyle='#8a8f3a'; g.strokeRect(1,1,148,h-2);
    g.fillStyle='#faff69'; g.font='700 13px ui-monospace,Menlo,monospace';
    g.fillText('primary.idx',8,18);
    p.granules.forEach((gr,gi)=>{
      const probing=p.probe===gi, inR=p.showVerdict&&p.verdict&&p.verdict[gi];
      if(probing){ g.fillStyle='rgba(250,255,105,.2)'; g.fillRect(4,26+gi*22-13,142,18); }
      if(inR){ g.fillStyle='#7dffb2'; g.fillRect(4,26+gi*22-13,3,18); }
      g.fillStyle=probing?'#faff69':(inR?'#d5f6c9':'#b9bd7a');
      g.font=(probing?'700 ':'')+'13px ui-monospace,Menlo,monospace';
      g.fillText('g'+(gi+1)+' → '+fmtT(gr[0])+(probing?' ?':''),8,30+gi*22);
    });
    if(p.showVerdict&&p.rangeK!=null&&p.rangeK<n){
      g.fillStyle='#6fe3ff'; g.font='700 12px ui-monospace,Menlo,monospace';
      g.fillText('range: g'+(p.rangeK+1)+'〜g'+n,8,h-8);
    }
  }),h};
}
function skipTex(p){
  const n=p.granules.length, h=40+n*22+8;
  return {tex:makeText(130,h,g=>{
    g.fillStyle='#1a1420'; g.fillRect(0,0,130,h);
    g.strokeStyle='#8a6fb0'; g.strokeRect(1,1,128,h-2);
    g.fillStyle='#c9a2ff'; g.font='700 12px ui-monospace,Menlo,monospace';
    g.fillText('skip idx',8,16);
    g.fillStyle='#6e5a8a'; g.font='10px ui-monospace,Menlo,monospace';
    g.fillText(IDXT==='set'?'set(service)':'bloom(service)',8,28);
    p.granules.forEach((gr,gi)=>{
      const skipped=p.showVerdict&&p.skipx&&p.skipx[gi];
      if(skipped){ g.fillStyle='rgba(255,180,111,.2)'; g.fillRect(4,38+gi*22-12,122,18); }
      g.fillStyle=skipped?'#ffb46f':'#a08cc0'; g.font='11px ui-monospace,Menlo,monospace';
      const s=[...granSvcs(gr)].sort();
      g.fillText(IDXT==='set'?'{'+s.map(i=>SVA[i]).join(',')+'}':bloomBits(new Set(s)).toString(2).padStart(8,'0'),8,42+gi*22);
    });
  }),h};
}
function plate(texH,wW){
  const g=new THREE.Group();
  const b=board(wW,texH.h/150*wW,texH.tex); b.position.y=texH.h/150*wW/2+0.16;
  const post=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.18,0.03),MAT.post); post.position.y=0.08;
  g.add(b,post); g.userData.board=b;
  return g;
}

// ---- Part ビュー(スラブ+タイル列+プレート) ----
const partViews=new Map(); let frame=0;
function partSig(p){ return p.granules.map(g=>g.join(',')).join('|'); }
function buildPart(p){
  const grp=new THREE.Group(); scene.add(grp);
  const rows=p.granules.length;
  const wW=GPR*(CELL+GAP)*S+0.34, dW=rows*CELLD/0.82+0.3;
  const nameTex=makeText(360,34,g=>{ g.font='700 15px ui-monospace,Menlo,monospace'; g.fillStyle='#98a0b3'; g.fillText('Part '+p.name+' ('+(p.granules.length*8192).toLocaleString()+' 行)'+(p.lvl>0?' マージ産':''),2,22); });
  const slab=new THREE.Mesh(new THREE.BoxGeometry(wW,0.09,dW),[MAT.slab,MAT.slab,MAT.slabTop,MAT.slab,MAT.slab,MAT.slab]);
  slab.position.set(wW/2-0.17,0.045,dW/2-0.15);
  const name=board(wW*0.96,wW*0.96*34/360,nameTex); name.rotation.x=-Math.PI/2;
  name.position.set(wW/2-0.17,0.095,-0.02);
  grp.add(slab,name);
  const cells=[];
  p.granules.forEach((g,gi)=>{ g.forEach((v,ci)=>{
    const m=makeCell(v,'norm');
    m.position.set(ci*(CELL+GAP)*S, 0.09+CELLHT/2, 0.14+gi*CELLD/0.82);
    grp.add(m); cells.push({m,gi,ci,v});
  });});
  const idx=plate(idxTex(p),1.0); idx.position.set(wW+0.28-0.17,0.09,dW*0.35);
  const skp=plate(skipTex(p),0.9); skp.position.set(wW+0.28-0.17,0.09,dW*0.8);
  grp.add(idx,skp);
  const badge=board(1.4,0.22,makeText(220,34,g=>{ g.font='700 18px ui-monospace,Menlo,monospace'; g.fillStyle='#ff7d7d'; g.fillText('✂ partition(minmax)',2,24); }));
  badge.position.set(wW/2,0.5,dW/2); badge.visible=false; grp.add(badge);
  const projTex=makeText(300,26,g=>{ g.font='700 13px ui-monospace,Menlo,monospace'; g.fillStyle='#c9a2ff'; g.fillText('⚡proj: ORDER BY service のコピーを内蔵',2,18); });
  const proj=board(wW*0.96,wW*0.96*26/300,projTex); proj.rotation.x=-Math.PI/2;
  proj.position.set(wW/2-0.17,0.095,dW-0.06); proj.visible=false; grp.add(proj);
  return {grp,cells,idx,skp,badge,proj,sig:partSig(p),idxSig:'',skpSig:''};
}
function idxSigOf(p){ return [p.probe,p.showVerdict,p.rangeK,(p.verdict||[]).join(''),partSig(p)].join('#'); }
function skpSigOf(p){ return [IDXT,p.showVerdict,Object.keys(p.skipx||{}).join(','),partSig(p)].join('#'); }

// ---- レーンビュー(プラットフォーム+評価ゾーン+カウンター柱) ----
const laneViews=[];
function buildLane(i){
  const grp=new THREE.Group(); scene.add(grp);
  const g0=laneGeom(i);
  const wW=g0.w*S, dW=g0.h*S*1.15;
  const plat=new THREE.Mesh(new THREE.BoxGeometry(wW,0.1,dW),MAT.plat);
  plat.position.set(wW/2,0.05,dW/2); grp.add(plat);
  const ring=new THREE.Mesh(new THREE.BoxGeometry(wW,0.02,0.06),new THREE.MeshBasicMaterial({color:LANE_COL[i]}));
  ring.position.set(wW/2,0.11,0.03); grp.add(ring);
  const title=board(wW*0.92,wW*0.92*30/430,makeText(430,30,g=>{ g.font='700 16px ui-monospace,Menlo,monospace'; g.fillStyle='#98a0b3'; g.fillText('processing lane '+(i+1)+' = CPU コア',2,21); }));
  title.rotation.x=-Math.PI/2; title.position.set(wW/2,0.105,0.16); grp.add(title);
  // 評価ゾーン(SIMD で光る面)
  const evalPad=new THREE.Mesh(new THREE.PlaneGeometry(wW*0.46,dW*0.5),
    new THREE.MeshBasicMaterial({color:0x14324a,transparent:true,opacity:0.7}));
  evalPad.rotation.x=-Math.PI/2; evalPad.position.set(wW*0.42,0.102,dW*0.62); grp.add(evalPad);
  const zl=board(wW*0.4,wW*0.4*24/240,makeText(240,24,g=>{ g.font='13px sans-serif'; g.fillStyle='#4d7c8a'; g.fillText('SIMD 一括評価(束ごと)',2,17); }));
  zl.rotation.x=-Math.PI/2; zl.position.set(wW*0.42,0.104,dW*0.93); grp.add(zl);
  // カウンター柱(部分集計)
  const pillar=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.6,0.14),MAT.post);
  pillar.position.set(wW-0.42,0.3,dW*0.62); grp.add(pillar);
  const counter=board(0.86,0.62,makeText(150,110,g=>{}));
  counter.position.set(wW-0.42,0.62,dW*0.62+0.08); grp.add(counter);
  const evalCells=[];
  for(let ci=0;ci<GPR;ci++){
    const m=makeCell(0,'norm'); m.visible=false;
    m.position.set(wW*0.24+ci*(CELL+GAP)*S,0.1+CELLHT/2,dW*0.62);
    grp.add(m); evalCells.push(m);
  }
  const queue=[];
  for(let q=0;q<4;q++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.06,0.12),new THREE.MeshBasicMaterial({color:LANE_COL[i],transparent:true,opacity:0.45}));
    m.visible=false; m.position.set(0.35,0.13,dW*0.35+q*0.16); grp.add(m); queue.push(m);
  }
  return {grp,plat,evalPad,pillar,counter,evalCells,queue,ring,cSig:''};
}
for(let i=0;i<LANES;i++) laneViews.push(buildLane(i));
function counterTex(l){
  const ents=Object.keys(l.partial).map(Number).sort((a,b)=>a-b);
  return makeText(150,110,g=>{
    g.fillStyle='#101a13'; g.fillRect(0,0,150,110);
    g.strokeStyle='#2f5c41'; g.strokeRect(1,1,148,108);
    g.fillStyle='#5f8a6f'; g.font='700 11px sans-serif'; g.fillText('部分集計',8,16);
    if(!ents.length){ g.fillStyle='#3f664f'; g.font='700 18px ui-monospace,Menlo,monospace'; g.fillText('—',66,64); }
    ents.slice(0,4).forEach((b,i2)=>{
      g.fillStyle='#7dffb2'; g.font='700 13px ui-monospace,Menlo,monospace';
      g.fillText(fmtT(b)+'台 '+l.partial[b].toLocaleString(),8,38+i2*20);
    });
  });
}

// ---- MV テーブル ----
function mvTable(wW){
  const grp=new THREE.Group(); scene.add(grp);
  const top=new THREE.Mesh(new THREE.BoxGeometry(wW,0.06,1.05),MAT.slabTop); top.position.y=0.28; grp.add(top);
  [[-wW/2+0.08,0.5],[wW/2-0.08,0.5]].forEach(([x,z])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.28,0.05),MAT.post); leg.position.set(x,0.14,0); grp.add(leg);
  });
  const boardM=board(wW*0.96,1.0*0.96,makeText(430,300,g=>{}));
  boardM.rotation.x=-Math.PI/2+0.5; boardM.position.y=0.52; boardM.position.z=-0.1; grp.add(boardM);
  grp.userData.board=boardM;
  return grp;
}
const mvT1=mvTable(3.0), mvT2=mvTable(3.0);
let mvSig='';
function mvTex1(){
  const ents=Object.keys(mv).map(Number).sort((a,b)=>a-b);
  return makeText(430,300,g=>{
    g.fillStyle='#c9a2ff'; g.font='700 20px sans-serif'; g.fillText('MV hourly_counts(書き込み時に自動集計)',4,24);
    g.fillStyle='#57617a'; g.font='12px ui-monospace,Menlo,monospace';
    g.fillText('CREATE MATERIALIZED VIEW … SELECT toStartOfHour(ts), count()',4,44);
    if(!ents.length){ g.fillStyle='#57617a'; g.font='15px sans-serif'; g.fillText('(まだ空。MV は作成後の INSERT だけを反映)',4,80); }
    ents.slice(0,8).forEach((b,i2)=>{ g.fillStyle='#d5f6c9'; g.font='700 17px ui-monospace,Menlo,monospace';
      g.fillText(fmtT(b)+'〜  '+mv[b].toLocaleString(),8,78+i2*26); });
  });
}
function mvTex2(){
  const days=Object.keys(mv2).sort();
  return makeText(430,300,g=>{
    g.fillStyle='#c9a2ff'; g.font='700 20px sans-serif'; g.fillText('MV daily_counts ← hourly(カスケード)',4,24);
    if(!days.length){ g.fillStyle='#57617a'; g.font='15px sans-serif'; g.fillText('(MV の結果を別の MV がさらに集計できる)',4,60); }
    days.forEach((d,i2)=>{ g.fillStyle='#d5f6c9'; g.font='700 17px ui-monospace,Menlo,monospace';
      g.fillText(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)+'  '+mv2[d].toLocaleString(),8,60+i2*26); });
  });
}

// ---- 飛行体: セルタイル実体が飛ぶ ----
const flyViews=new Map(); let flySeq=0;
function flyMesh(f){
  if(f.kind==='gran'){
    const grp=new THREE.Group();
    (f.cells||[]).forEach((v,ci)=>{ if(v==null) return;
      const m=makeCell(v,'norm'); m.scale.set(0.8,0.8,0.8);
      m.position.x=ci*(CELL+GAP)*S*0.8; grp.add(m); });
    return grp;
  }
  if(f.kind==='chip'){
    const tex=makeText(240,40,g=>{ g.font='700 17px ui-monospace,Menlo,monospace';
      const tw=g.measureText(f.txt).width+20;
      g.fillStyle='#101a13'; g.strokeStyle=f.col||'#7dffb2'; g.lineWidth=2;
      g.beginPath(); g.roundRect(2,4,Math.min(tw,236),32,16); g.fill(); g.stroke();
      g.fillStyle='#7dffb2'; g.fillText(f.txt,12,26); });
    return board(1.7,1.7*40/240,tex);
  }
  if(f.kind==='idxv'){
    const tex=makeText(110,34,g=>{ g.font='700 20px ui-monospace,Menlo,monospace'; g.fillStyle='#faff69'; g.fillText(fmtT(f.v),4,24); });
    return board(0.7,0.7*34/110,tex);
  }
  return makeCell(f.v,'norm');
}
// ---- メインループ ----
window.__render3d=function(){
  frame++;
  // Part
  parts.forEach(p=>{
    if(p.dead) return;
    let v=partViews.get(p.id);
    if(v&&v.sig!==partSig(p)){ scene.remove(v.grp); partViews.delete(p.id); v=null; }
    if(!v){ v=buildPart(p); partViews.set(p.id,v); }
    v.seen=frame;
    v.grp.position.set(wx(p.x+18), (p.building?0.02:0)+(p.flash>0?Math.sin(frame*0.3)*0.01:0), wz(p.y+22));
    const op=(p.alpha??1)*(p.partPruned?0.5:1);
    v.grp.traverse(o=>{ if(o.material&&!Array.isArray(o.material)){ o.material.transparent=true; o.material.opacity=op*(o.material.userData?.baseOp??1); } });
    v.cells.forEach(c=>{
      c.m.visible=!(p.building&&!p.shown[c.gi*GPR+c.ci]);
      restyleCell(c.m,c.v,cellState(p,c.gi,c.ci,c.v));
    });
    const is1=idxSigOf(p);
    if(v.idxSig!==is1){ v.idxSig=is1; const th=idxTex(p); const b=v.idx.userData.board; b.material.map?.dispose(); b.material.map=th.tex; b.material.needsUpdate=true; }
    const is2=skpSigOf(p);
    if(v.skpSig!==is2){ v.skpSig=is2; const th=skipTex(p); const b=v.skp.userData.board; b.material.map?.dispose(); b.material.map=th.tex; b.material.needsUpdate=true; }
    v.badge.visible=!!p.partPruned;
    if(v.badge.visible) v.badge.lookAt(camera.position.x,v.badge.position.y+v.grp.position.y,camera.position.z);
    v.proj.visible=!!p.hasProj;
  });
  partViews.forEach((v,id)=>{ if(v.seen!==frame){ scene.remove(v.grp); partViews.delete(id); } });
  // レーン
  laneViews.forEach((lv,i)=>{
    const g0=laneGeom(i);
    lv.grp.position.set(wx(g0.x),0,wz(g0.y));
    const l=lanes[i];
    lv.evalPad.material.color.setHex(l&&l.simd>0?0x2a7ba8:0x14324a);
    lv.evalPad.material.opacity=l&&l.simd>0?0.5+l.simd*0.5:0.55;
    lv.evalCells.forEach((m,ci)=>{
      const v=l&&l.cur?l.cur.cells[ci]:null;
      m.visible=v!=null;
      if(v!=null) restyleCell(m,v,(l.simd>0?(v>=PRED&&(!SVCF||svcOf(v)===SVCF)?'hit':'norm'):'norm'));
    });
    lv.queue.forEach((m,qi)=>{ m.visible=!!(l&&l.queue.length>qi); });
    const sig=l?JSON.stringify(l.partial):'idle';
    if(lv.cSig!==sig){ lv.cSig=sig;
      lv.counter.material.map?.dispose();
      lv.counter.material.map=counterTex(l||{partial:{}}); lv.counter.material.needsUpdate=true; }
    lv.counter.lookAt(camera.position.x,lv.counter.position.y,camera.position.z);
  });
  // MV
  {
    const mg=mvGeom();
    mvT1.position.set(wx(mg.x+mg.w/2),0,wz(mg.y+40));
    mvT2.position.set(wx(mg.x+mg.w/2),0,wz(mg.y+40)+1.3);
    const sig=JSON.stringify([mv,mv2]);
    if(mvSig!==sig){ mvSig=sig;
      const b1=mvT1.userData.board; b1.material.map?.dispose(); b1.material.map=mvTex1(); b1.material.needsUpdate=true;
      const b2=mvT2.userData.board; b2.material.map?.dispose(); b2.material.map=mvTex2(); b2.material.needsUpdate=true; }
    const fl=mvFlash>0?1+mvFlash*0.06:1; mvT1.scale.set(fl,1,fl);
    const fl2=mv2Flash>0?1+mv2Flash*0.06:1; mvT2.scale.set(fl2,1,fl2);
  }
  // 飛行体
  fly.forEach(f=>{
    if(f.__id==null) f.__id=++flySeq;
    let m=flyViews.get(f.__id);
    if(!m){ m=flyMesh(f); scene.add(m); flyViews.set(f.__id,m); }
    m.userData.seen=frame;
    m.position.set(wx(f.x), 0.75+(f.arc?Math.sin(Math.PI*Math.min(1,f.t))*f.arc*S:0), wz(f.y));
    if(f.kind==='chip'||f.kind==='idxv') m.lookAt(camera.position.x,m.position.y,camera.position.z);
  });
  flyViews.forEach((m,id)=>{ if(m.userData.seen!==frame){ scene.remove(m); flyViews.delete(id); } });
  camUpd();
  renderer.render(scene,camera);
};
</script>
